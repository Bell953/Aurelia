X(60,{scene:'An overgrown garden under a ceiling of black roots. Pale flowers grow everywhere: along the walls, between the flagstones, out of the cracks in an old iron gate. A tall cloaked figure moves among them with a watering can, bending over each bloom with great care. Where he has already passed, there are small stone markers, and each is carved with a single name.',
 line:'“Careful where you step. They are just coming up. Everyone here is just coming up.”',
 r:['He straightens, and under the hood there is a face that is almost kind. “Every flower here was someone once. The binding does not destroy what it takes. It plants it.” He touches a bloom and it leans into his palm. “I tend them because someone should. They do not know what they were, only that they are glad to be watered.” His voice thins. “Veyra came to see me once, near the end. She sat on that bench and said she was sorry. I said, for what? She said, ‘For being the one who was too late.’” <i>“She did not feed the Ember. She stepped in to ease it.”</i>','“Do not speak that way,” he says, quietly, not angrily. “They can hear.” Petals close all across the garden at once, like a held breath.','The roots overhead stir. The flowers lean toward you, all at once, like a field turning toward the sun. “I am sorry,” he says. “They do not like to be trampled.”'],
 end:'The Reaper kneels in the flowers and lays down the watering can. The garden brightens all at once, every pale bloom turning gold at the edges. He closes his eyes, and the petals drift down over him until there is nothing left but a single stone marker carved with a name, and beside it, one more flower just coming up.'});
X(70,{scene:'A hall of mirrors the colour of old glass. Your reflection arrives a half step before you do, and some of the mirrors show people you do not recognise. At the far end a huge minotaur sits on the floor, his horned head bowed, arms wrapped around himself. The mirrors around him are all cracked from the inside. He has not blinked in a long time.',
 line:'“I can still see all of it, you know. Everything the mirrors remember. That is the trouble. It is only ever what they remember.”',
 r:['“I gave my sight to the Ember, and what it gave back was memory. Every face I ever saw, every room.” His voice is a low rumble, almost gentle. “I saw her, the last time she came. Veyra stood right there. She said, and I will say it for you exactly, because someone should: <i>‘Let it go out when it is ready. Do not feed it. Do not be afraid of the dark.’</i> I told the others. The Sovereign said I had misheard.” He lifts his head. “I did not mishear. I have never been wrong about a face in my life.”','“Speak plainly? I have. For three hundred years.” He rises slowly, the mirrors shivering around him. “Nobody wants plain. They want a monster to put in the story.”','“Then break them,” he says softly, and gestures at the mirrors. “They have been waiting.” The reflections all step forward at once.'],
 end:'The minotaur falls, and the mirrors go out one by one, until only the cracks catch the light. He lies on his back and looks up at the ceiling as if he were seeing it for the first time. “There,” he says. “That is a ceiling. I forgot ceilings.” A smile spreads across his broken face. “It is not much to look at. I could look at it forever.”'});
X(80,{scene:'A vast cavern with no floor, only a ring of black stone suspended in a roaring storm. Lightning crawls along the walls and does not die. At the centre, on a throne of fused iron, sits a crowned figure wrapped in thunder. His mouth moves, but every word is lost in the noise. When he sees you he stands, and the storm stills for a single breath.',
 line:'“Quiet. Be quiet, all of you. Someone has come, and I would like to be heard.”',
 r:['“I gave my voice, and what I got back was this.” The storm answers him, a roll of thunder like a laugh. “I swore the oath. We all did. Ten of us, ten lines, ten hands. <i>We will feed the fire until it is safe.</i> Do you know what none of us wrote? What <i>safe</i> meant. We were so afraid, and we were so tired, and nobody asked.” His crown flickers. “I have been shouting for three hundred years. I would like to say one thing quietly before I go.”','“Orren?” The storm goes silent. “He was the best of us. He was the one who stayed.” The name hangs in the air like a struck bell.','“Then let it be loud,” he says, and the whole cavern answers with a single crack of white light.'],
 end:'The thunder stops. The silence that follows is so complete you can hear a single drop of water fall somewhere in the dark. The Sovereign of Storms lowers himself onto his throne and opens his mouth, and what comes out is not a roar or a command, only the quietest, most ordinary voice. “Thank you,” he says. “Thank you for listening.”'});
X(90,{scene:'A court of ash and velvet, empty but for one throne. On it sits a figure with no face, only a smooth pale mask over a body in rich robes, perfectly still. Behind the throne hang portraits of ten people, and the tenth has been scratched out. The air smells faintly of someone’s kitchen, bread and woodsmoke, as if the memory of a home were trapped in the walls.',
 line:'“Welcome. I have been told I am the emperor. I am not sure what that means, but everyone seems very certain.”',
 r:['“I gave my self, and it did not give back.” The mask tilts. “I know I was a person. I know I had a name, and a mother who called me in to eat, and a smell I loved. I cannot hold any of it.” A long pause. “The promise was that each gift would be returned. Every Keeper was told so. The Sovereign gave his word. I believed him, and I think that was the most human thing I ever did.” He turns to the scratched portrait. “He never meant it. Not any of it.”','“Ask the Sovereign? He will tell you it was necessary, and in his way he believes it.” The mask regards you for a long moment. “That is the most frightening thing about him.”','“Then be quick,” says the mask, gently. “I have been standing a very long time.”'],
 end:'The mask cracks down the middle and falls away. Behind it is not a monster, only a tired, ordinary face with the beginnings of a smile. For a moment he looks like someone’s son. “Oh,” he whispers. “It was a kitchen. We had a kitchen.” The robes slump on the throne, and the smell of bread fills the court.'});
X(100,{scene:'The throne room at the bottom of the world. Nine empty chairs stand in a ring, each with a single object on its seat: a rusted sword, a horn, a scoured plate, a coat of frost, a pearl, a rose, a mirror shard, a thunderhead, a mask. On the tenth chair, much larger than the rest, sits a figure in a crown of black iron. The Ember glows through the floor, steady as a heartbeat, and the whole room breathes with it.',
 line:'“You came all this way. Do you know how rare that is? Sit, if you like. I do not often have company, and I would like to know why you came.”',
 end:'The Sovereign slides from the throne and kneels. The crown rolls across the floor and stops against your boot. “It was never meant to be forever,” he says. “She said it would be a season. I have lost count of the winters.” He looks at the nine empty chairs, and his voice is very small. “I only wanted to keep them warm.”'});
})();

R(10,'You find a young delver at the foot of the Bone Knight’s dais, prying at the fallen gauntlet with the tip of a worn, notched blade. He is lean, sunburnt, a little too well dressed for the Dungeon, and he moves like someone who has practised being confident in front of a mirror. When he hears you he does not turn around. He just shifts his weight, so you cannot see what he is holding.',
 '“Don’t. That’s mine. I have been tracking this one for three days, and I am not about to be beaten to it by someone I have never met.”',
 ['He laughs, too loudly, and it echoes in the empty hall. “Fast. Sure. Everyone says it like it’s a virtue. Fast, clever, lucky, talented. Do you know what I have? A map I drew myself and a plan, and now you have my gauntlet.” He scrapes his boot on the stone. “I’m Corvin. Remember it. Everyone will.”','“I don’t take scraps.” He takes it anyway, quickly, as if you might change your mind, and will not look at you. “You didn’t have to do that. I would have gotten it. Eventually.” He turns the gauntlet over in his hands. “…Thank you. I think. It is hard to tell with you.”','He goes quiet, and the swagger slides off him all at once. “My mother’s. She went down when I was nine. She told me she would be back before the snow, and she was very good at keeping her word.” He runs his thumb along the nick in the blade. “I am going to bring it back to the bottom. And if she is down there, I want her to know I kept it sharp.”','He watches you go, hand still half-raised toward the gauntlet. “You did not even say anything.” His voice is small. “Not even to tell me I was too slow.” You can feel him staring at your back all the way to the stair.']);
R(30,'The camp at the Ember Warden’s lake is quiet, banked coals, a low cough, the clink of a kettle. Corvin sits apart from the others with his sleeve rolled to the elbow. The forearm is scorched, the skin shiny and tight, and a faint glow lingers around the burn like a coal that will not go out. He is grinning, but only with his mouth. On the rock beside him sits a tiny, bright thing that looks like a coin.',
 '“Have you used the altar? Be honest with me. I need to know if I’m cheating or just keeping up. If you tell me everyone does it, I will stop worrying about it.”',
 ['“Because I am behind.” It comes out sharp. “Is that what you wanted to hear? I am behind, and I have been behind since the first floor. Everyone I meet is faster, or lucky, or has a mentor.” He rubs the scorched arm. “It does not hurt, you know. It is almost warm. That is the worst part. It feels like being told you’re good enough.”','He listens, truly listens, while you tell him what the altar asked of you, and the grin goes out of his face. “That is… not what it told me.” He puts the little bright thing down on the rock and looks at it for a long moment. “Maybe it only tells everyone what they want to hear. Thank you. I am not taking it. Not today.”','“Never touched it?” He looks at you hard, and the flat way he says it means he already knows. “Then it is only me.” He pulls the sleeve down over the burn. “It must be nice, being whatever you are.”','He lets it go, but not kindly. “Loot. Of course.” The silence afterwards is full of everything neither of you said, and he does not speak again before you leave.']);
R(50,'At the Gravewarden’s camp, the fires are low and the old stones are still. Corvin stands in the lamp-light with two wooden practice swords, one tossed in each hand. His eyes are brighter than they were, and a thin line of ember-light runs down each wrist like a vein. He is smiling, and for once it looks almost like the real thing.',
 '“One round. Not to the death. Just so I know where I stand. I think I have been walking beside you for a long time without really knowing how far behind I am.”',
 ['The camp laughs, a ripple of easy cruelty that spreads down the fires. He does not. His smile stays fixed in place, a shape his mouth has forgotten how to leave. “Weaker delvers should stay topside,” he says, repeating you flatly. “Noted.”','He realises within a moment. “Don’t you dare.” His voice cracks. “I did not ask for that. I asked for a fight, not charity.” The wooden sword shakes in his hand. “Never. Do that again. Please.” He lowers it. “Thank you, though. You are the only one who would.”','He takes the hand after a long moment, and his grip is hotter than it should be. “Next time,” he says, and almost means it. He looks away at the fires. “You know I am not as good as I pretend to be. I just wanted someone to see me try.”','“Afraid you’ll lose?” He says it lightly, but his smile falters. He sets the practice sword down on a stone, very gently, and does not ask again.']);
R(70,'You find Corvin at the camp with his back to the fire, polishing a blade that is already clean. The Archivist’s page is in your pocket, soft with handling, a few lines of cramped ink. His mother, Mara, turned back at the fortieth floor and died on the long climb home, with a gift in her pack meant for him. Her last words are on the page. He does not know. He is humming under his breath, a song his mother used to sing.',
 '“There you are. I was starting to think you had gone down without me.” He glances up, and his face is open for the first time. “Is something wrong?”',
 ['He reads it alone, standing at the edge of the firelight, and he does not speak for a very long time. When he finally does, his voice is steady, which is somehow worse. “She was coming home.” A breath. “All this time I thought she had left me down here.” He folds the page along its old creases. “Thank you. You did not have to give me this. You could have decided what was best for me.” He looks up. “Nobody ever did what was best for me. They just decided.”','He never learns the truth. You carry the page for the rest of the descent, and in time it begins to feel heavier than the sword. Sometimes, at camp, he looks at you as if he were about to ask something, and then he does not.','The words come out of your mouth before you can stop them. He says nothing. His face does not move, and that is the terrible part. The fire pops behind him. “I see,” he says at last, very quietly. “Good to know what you think of her.” He walks out of the light, and the words stay with him, and with you.','“Not now.” It is the wrong thing to say, and you both know it. “Not now,” he repeats, flatly. The moment passes, and he notices. For the rest of the night he is very polite, and very far away.']);
R(90,'At the last camp the fires are barely embers. Corvin sits cross-legged before the stair, and the veins on his arms have gone black, with a light behind them that pulses with every breath. His eyes are faintly gold, and his voice is quiet and strangely gentle. He looks thin, almost hollow, and utterly sure.',
 '“I am taking the altar’s last offer. Everything. All of it. It says it can make me enough.” He smiles at you, and it is the saddest thing you have seen in the Dungeon. “I wanted you to hear it from me first.”',
 ['“Go on then. Let’s see if it makes you anyone.” He laughs, and it sounds like glass. “I’ll be waiting at the bottom. Try to be quick. I think I’ll be very different when you get there.”','He hesitates, and for a heartbeat the light in his eyes wavers. “…Maybe.” His voice breaks. “Maybe I could. If you waited. If you would walk beside me, and not ahead.” He takes a long breath. “I am afraid it is already too late. But thank you for asking.”','“Then what can?” It is not a challenge. He asks like a child asking in the dark. “Tell me. Please. I have been asking everyone, and nobody knows.” He waits for your answer, and the whole camp holds its breath with him.','He leaves without looking back. His footsteps on the stair are light, almost cheerful, and then they are gone.']);
RIVAL[50].scene='At the Gravewarden’s camp, Corvin challenges you to a short sparring bout. Thin lines of ember-light run down his wrists. He is smiling, and for once it looks almost real.';

  if(ps[0]) ps[0].innerHTML='The Ember is not a flame but a vast, warm swell of light under stone, beating like a heartbeat, and the whole chamber rises and falls with it. In front of it stands Corvin, taller and thinner than you remember, his skin veined with ember-light, his eyes the colour of the Ember itself. His mother’s sword hangs undrawn at his side. He is not holding it like a weapon. He is holding it like a keepsake.';

(function(){
ILYEN.splice(0,9,
'A woman tends the fire at the edge of the camp, bundled in a worn grey cloak, a kettle singing beside her. She looks up, nods once, and goes back to stirring. She does not ask who you are or where you are going. In a place like this, that kindness is rare.',
'The healer from the last camp is here again, a little slower on her feet than before. She sets a cup of tea by your elbow without a word. When you thank her, she says, “It is only tea,” and her smile is the kind that does not reach all the way.',
'She is here again, and her hands shake when she pours. She notices you noticing, and tucks them under her cloak. “Old habits,” she says. “The cold gets into the knuckles first.”',
'The healer hums a tune you almost know while she works. When you ask what it is, she stops mid-note. “Something I learned a long time ago,” she says. “I had forgotten I still remembered it.”',
'She looks at you for a long moment across the fire. “Veyra would have liked you,” she says, then looks as if she wished she had not said it. “Do not mind me. I am an old woman with a long memory.”',
'She is thinner now, and she moves as if each step has a price. “Keep going,” she tells you quietly. “I will be here. I am always here.” It is the first time she has said anything that sounded like a promise.',
'Her cloak is patched in new places. She does not ask about the Keepers, and she does not ask what they said. She only studies your face, as if checking whether it still looks like someone who can bear it.',
'She is very tired, and for once she says so. “I have kept this watch a very long time,” she says. “I would like, one day, to put it down.” She laughs softly. “Do not tell anyone I said that.”',
'She watches the stair down, and does not smile. “The bottom is close,” she says. “Whatever you find there, remember it was never only yours to carry.” She turns back to the fire. “And forgive an old woman for hoping.”');
emberChamber=function(){ const o=[];
  if(wakeOK()) o.push(['<span style="text-shadow:0 0 10px #e3a855">The Ember is already glowing toward you.</span>','endWake()',1]);
  if(hasAllTrophies()&&!STORY.corvinDead) o.push(['“Relight the Ember.”','endRelight()']);
  if(divideOK()) o.push(['“Divide the flame.”','endDivide()']);
  o.push(['“Put it out.”','endOut()']); if(STORY.altar>=5) o.push(['“Take the Crown.”','endCrown()']);
  storyOverlay(EH('The Ember Chamber')+'<p style="font-style:italic;color:var(--text-muted)">The stair opens into a cavern so wide you cannot see the walls. The floor rises and falls slowly, like the chest of something asleep, and the light beneath the stone beats with the slow patience of a heart. Every surface is warm. Every sound you make seems to fall into it and be forgiven. At the edge of the glow, a grey-cloaked woman stands with a long iron poker in her hands, and for the first time since you met her she is not hiding how tired she is.</p><p><b>Ilyen:</b> “This is the last room. I have waited sixty years for someone to stand here with me. I do not know which of the choices before you is right. I only know it is yours, and that whatever you choose, you choose it for all of them.”</p><p><b>Ilyen:</b> “The Keepers will not know. They have already given what they had. But the city will. The next hundred years will.” She breathes out. “Take your time. The Ember has waited this long.”</p>'+EB(o)); };
endRelight=function(){
  storyOverlay(EH('Relight the Ember')+EP('You lay out the trophies on the warm stone one at a time: the Gilded Fang, the Twilight Sigil, the Ember Core, the Frost Shard, the Tidal Pearl, the Bone Bloom, the Obsidian Eye, the Storm Heart, the Void Fragment and the Abyssal Crown. Each one is warm in your hands, and each seems to recognise where it belongs. As you set them down, the stone swallows them gently, like water taking a stone, and with every one a Keeper’s gift goes back into the Ember: a night’s sleep, a morning’s sun, a name, a breath, a heartbeat, a voice. The light under the floor turns from red to gold.')+EP('The cavern brightens until you have to shield your eyes. It is not a hot light. It is the light of a kitchen window at the end of a long winter.')+EP('<b>Ilyen:</b> “It will need someone to stay. It always did. A flame this size cannot burn without a keeper, and there is no one left who knows the way of it but me.”')+EB([['“I’ll stay.”','relightA(0)'],['“Is there another way?”','relightA(1)'],['“What’s your name?”','relightA(2)']])); };
relightA=function(i){
  if(i===1){ storyOverlay(EP('She is quiet for a long moment, turning the poker in her hands. “There might be,” she says at last. “I have thought about it every night for sixty years. But I do not know what it would take, and I do not think I will live to find out.” She meets your eyes. “Come back when you know what the Ember really is. If you ever do.” Nothing is decided.')+EB([['Back','emberChamber()']])); return; }
  const a=i===0?'<b>Ilyen:</b> “No.” She says it gently, and she is smiling. “You have a world to walk back up to, and I have had mine. It has been waiting for me since the day she walked into it. I was a girl of nineteen. She smiled at me and said, ‘You will be good at this,’ and I believed her.”':'<b>Ilyen:</b> “Ilyen.” It sounds strange in her mouth, like a word from another language. “I was Veyra’s apprentice. I am the last person alive who remembers her laugh. I have not said my name aloud in sixty years.”';
  const bond=STORY.rival.bond&&!STORY.corvinDead;
  const c=bond?EP('Footsteps on the stair, quick ones. Corvin stops at the edge of the light, out of breath, his mother’s blade across his back.')+EP('<b>Corvin:</b> “Room for one more?”')+EP('<b>Ilyen:</b> “You’re late.”')+EP('<b>Corvin:</b> “I had a note to read.” He glances at you, and the old swagger is gone, replaced by something quieter and braver. “And a lot to unlearn.”')+EP('He sits down beside her, and the two of them keep the watch together, shoulder to shoulder, the way people do when they have decided not to be alone.'):EP('The light climbs around her without burning, golden at her shoulders and in her grey hair. The last thing you see is her hand on the poker, not letting go.');
  endFin('relight','Relighting','Above, the city’s lamps come back on one ward at a time, then all at once. The lanterns of the Hollow Ward burn without oil, and the goblin lamps flicker gold. Nobody up there will ever know who sits at the bottom, feeding a fire that was never meant to be fed, keeping the world warm one quiet night at a time. But sometimes, in the deepest part of winter, a child will look up at the lamps and feel, without knowing why, that someone is looking back.',EP(a)+EP('She takes the long iron poker that hangs by the edge of the glow and sits down on the warm stone, as if she had been waiting to do it her whole life.')+c); };
endOut=function(){
  storyOverlay(EH('Put it out')+EP('You kneel at the edge of the glow and ask the Ember, very quietly, whether it would like to rest. It does not answer in words. The light under the floor ripples once, like a sleeper turning over.')+EP('Ilyen does not stop you, but she does not pretend it is free. She stands with her arms folded inside her cloak and looks at the light for a long moment.')+EP('<b>Ilyen:</b> “The city will go dark. The winter will be hard. People will be cold, and some will not survive it. There will be anger, and it will be pointed at you.” She turns. “Are you sure you are not just tired?”')+EB([['“I’m sure.”','outA(0)'],['“Maybe I am tired.”','outA(1)'],['“It’s what she asked for.”','outA(2)']])); };
outA=function(i){
  if(i===1){ storyOverlay(EP('“Then rest first.” She says it kindly, and means it. “Sleep. Eat something. Come back when you are sure. I will still be here. I am always here.” Nothing is decided.')+EB([['Back','emberChamber()']])); return; }
  const a=i===0?'“Then let me be the one to tell them,” she says. “I have waited sixty years to say a hard thing to the city. Let me at least say it well.”':'Ilyen almost smiles, and it makes her look very young. “It is, is it not? <i>Let it go out when it is ready.</i> I have been so afraid of those words that I never once heard them as a kindness.”';
  storyOverlay(EH('The Keepers say goodbye')+EP(a)+'<p style="color:var(--text-muted)">The light goes down slowly, like a great breath being let out. You do not see the Keepers, but you hear them, as if from the next room. The Bone Knight lies down at last on the cold stone of his hall: “Relieved. At long last, relieved.” The Warchief sees the sun through a crack in the ceiling and laughs aloud: “Third shift’s done, lads.” The Warden says his name once, softly, and nobody else hears it. The Matriarch warms her hands at a fire that is only a fire, her wolves curled around her feet. The Drowned King breathes, and keeps breathing, and weeps. The Reaper’s garden blooms white all at once, every flower turning its face to a light that is only the dawn. The Minotaur lies on his back and sees the whole ceiling and laughs. The Storm Sovereign whispers, in his quiet ordinary voice: “Thank you.” The Hollow Emperor is someone: a kitchen, a voice calling him in to eat, bread on the table. And Orren stays last, kneeling by the throne. “She was right,” he says. “She was always right.”</p>'+EP('Ilyen holds out a small clay lamp, no bigger than a cupped hand, with a single coal glowing in it.')+EB([['Take the coal up with you.','outEnd(1)'],['Leave it.','outEnd(0)']])); };
outEnd=function(t){ endFin('out',t?'The small flame':'The dark',t?'You carry the coal up through a hundred floors, shielding it with your cloak, stopping at every camp to rest and feed it. When you step out into the Hollow Ward, the city is dark and bitterly cold, and people are clustered in doorways with their breath fogging. You light the first lamp in the central square. A child holds out her hands to it. Then an old man. Then a family. By the time the sun rises, nobody is left alone in the cold, and keeping the flame alive takes everyone, so everyone has a share. The city gets through the winter passing one small flame from hand to hand, and learns, a little, what it had forgotten about itself.':'The city goes dark all at once and is bitterly cold. People cluster in the old halls and sing, because there is nothing else to do. Some say it is the end, and some say it is the beginning, and nobody can tell which. By spring they have built a ward of stone hearths, each tended by whoever lives beside it, and nobody can say whose idea it was. It is the quietest night the city has ever known, and the longest, and by morning it is also, strangely, the most alive. You climb the long stair in the dark, and the Dungeon behind you is only a cave.'); };
endCrown=function(){
  storyOverlay(EH('The Crown')+EP('The voice rises from the Ember, the one you have heard at every altar, warm and patient and entirely sure of you. This time it says your name, and it sounds like someone who has known you all your life.')+EP('<b>The Voice:</b> “You have said yes '+STORY.altar+' times. Do you know what that means? It means you already know how this ends. The next is only habit.”')+EP('The Abyssal Crown hovers before you, black iron with a heart of ember-light, and you can feel it weigh nothing at all.')+EB([['“I’ll take it.”','crownA(0)'],['“What does it ask?”','crownA(1)'],['“No.”','crownA(2)']])); };
crownA=function(i){
  if(i===1){ storyOverlay(EP('<b>The Voice:</b> “Nothing you have not already given. Each yes was a coin. This is only the change.” It pauses, and the silence is almost tender. “You will be warm. You will never be cold again. You will never be alone, because the Ember is always with you.” A longer pause. “Is that not what everyone wants?”')+EB([['“I’ll take it.”','crownA(0)'],['“No.”','crownA(2)']])); return; }
  if(i===2){ storyOverlay(EP('The crown withdraws, and the voice says, without anger, in the gentlest tone you have ever heard: “You will be back. They always are. I can wait. I am very good at waiting.” Nothing is decided.')+EB([['Back','emberChamber()']])); return; }
  STORY.crowned=1;
  endFin('crown','The Crown','The Ember burns forever, steady and bright and unquestioned. The city above never goes dark, and the people there call the light a blessing, and are not wrong. You sit among the empty chairs and watch the sparks climb the shaft toward a surface you will not see again. Sometimes a delver comes down the long stair, tired and afraid, and the altar offers, and asks. You are very kind to them. You never tell them what it costs.',EP('“Kneel.” The Abyssal Crown settles on your head, heavier than any armour, warmer than any fire. A tenth and an eleventh chair grow out of the stone beside the others, and your chair is the grandest. “It asks only one thing,” the Voice murmurs. “That you never ask what it asks.”')+EP('Ilyen has not moved. Her face is very still. <b>Ilyen:</b> “She said let it go out.” She does not say it as an accusation. She says it as someone who has lost a very long argument and is only now realising it. She does not stay to see the rest.')); };
spareScene=function(){
  storyOverlay(EH('Lower your weapon')+EP('The Sovereign waits on one knee for a blow that does not come. The crown slides on his brow. The nine empty chairs are very quiet, and the Ember beneath the floor seems to hold its breath.')+EP('<b>Orren:</b> “Why?” His voice is a stranger’s, hoarse from disuse. “I have been wrong for three hundred years. I have done terrible things. You have every reason to finish this.” His hand trembles on the hilt. “Why?”')+EB([['“Because she wouldn’t have wanted this.”','spareB(0)'],['“Because I read her last words. All of them.”','spareB(1)'],['“Because I’m tired of killing Keepers.”','spareB(2)']])); };
spareB=function(i){ const a=['“She would have been furious with me,” he says, and a laugh breaks out of him like a sob. “She always was, when I was being clever. She would stand in the doorway with her hands on her hips and say, ‘Orren, you great fool.’ I would give anything to hear it once more.”','He is still for a long time. “<i>Do not be afraid of the dark.</i> I never heard that part. I had already run for the stair. When I came back there was only the fire, and the others kneeling, and no one to ask. I have been afraid of the dark every day since.” His voice breaks. “Is that really what she said?”','“So was she,” he says, very quietly. “By the end. She told me so, the last night. I did not listen. I thought she meant she was tired of me.”'][i];
  endFin('spare','Spare the Sovereign','Orren leaves the crown where it fell. He and Ilyen share the watch, and nobody is sacrificed. The nine chairs stay empty, because the Keepers are at rest, and the tenth is only a seat by a fire. Together, in the lamplight, they learn to speak the things they could not for three hundred years. You climb out through floors that are quiet for the first time, and the stairs do not seem so long.',EP('<b>Orren:</b> '+a)+EP('Footsteps on the stair, slow ones. A grey-cloaked woman stops at the edge of the throne room and looks at him for a very long time. <b>Ilyen:</b> “Orren.” <b>Orren:</b> “Ilyen. You have gotten old.” <b>Ilyen:</b> “You have gotten stubborn.” She sits in one of the empty chairs, and he sits in another, with a space between them. For the first time in three hundred years someone grieves Veyra aloud, and the other one answers. You let them have it.')+EP('Then the binding lets go, like a very long exhale. The gifts come back as faint sounds from the floors above: a knight lying down, a drumbeat stopping, a king’s first breath, a wolf’s sigh, a girl’s laugh in a kitchen.')+EP('<b>Orren:</b> “She said let it go out when it is ready. I think she meant that when it is, we will know.” <b>Ilyen:</b> “And until then?” <b>Orren:</b> “Someone sits with it. It should not be only you.”')); };
endDivide=function(){ storyOverlay(EH('Divide the Flame')+EP('They come down the stair one at a time, and the cavern fills with their light. Nib arrives first with a lantern and twenty goblins at his back, all of them blinking at the glow. Marrow comes after, her ferry-pole on her shoulder and the dark water of her halls dripping from her cloak. Old Hobb arrives red-faced from the climb, a battered kettle in one hand and an ancient sack in the other, and refuses to say what is in either. Last comes Thessaly, her ledger open on her arm, scribbling as she walks. Ilyen looks at all of them, and for the first time in sixty years, she looks surprised.')+EP('<b>Ilyen:</b> “I always thought it would take one of us to stay.” <b>Thessaly:</b> “It was never one. The founders drew ten wards on the plans: ten flames, not one. We only forgot, and we only have to carry them.”')+EP('Everyone agrees the Ember can be split. They look to you: who gets the first spark?')+EB([['“The warren.”','divA(0)'],['“The ferry lantern.”','divA(1)'],['“The city square.”','divA(2)']])); };
divA=function(i){ const t=['Nib cannot speak for a moment. Then the goblins take the first spark in a lantern and carry it up the stair singing a work-song nobody has heard in three hundred years. They return to the city as citizens, and the first thing they do is open every shuttered window in the Hollow Ward.','Marrow rows the spark across the Drowned Halls herself, and for the first time the dead can see the far shore. No one is crying at the docks that week. A ferryman who has not slept in a hundred years falls asleep with his head on his arms, smiling.','Hobb sets the first spark on the square’s oldest hearthstone, and everyone in the city sees it at once. The tavern is full for a month, and for once the rumours are happy ones.'][i];
  endFin('divide','Divide the Flame','The Guild takes a new banner, ten small flames in a ring, and delving becomes a trade instead of a debt. Ilyen climbs the stair between a goblin and a ferrywoman, carrying nothing, looking at her empty hands as if she had forgotten they could be empty. At the first landing she stops, closes her eyes, and lets the sun on her face for the first time in sixty years.',EP(t+' All ten sparks are carried back whichever you choose, and by the end of the week every ward has one.')); };
endWake=function(){ storyOverlay(EH('Wake the Ember')+EP('Corvin stands at your shoulder, his mother’s sword sheathed, his hand steady. You lay out the ten trophies on the warm stone, and this time they do not burn. They sink into the floor and hum, and the light under the cavern draws together into a shape beneath the rock, slow and vast and very old, turning toward you the way a sleeper turns toward a familiar voice.')+EP('<b>The Ember:</b> “You never asked me for anything. Everyone else did. Everyone else wanted warmth, or light, or power, or forgiveness. You only came to see.”')+EB([['“What are you?”','wakeA(0)'],['“Are you in pain?”','wakeA(1)'],['“Stay.”','wakeA(2)']])); };
wakeA=function(i){ const t=['“I was here before the city. I dream, and the city lived on my dream. They took it for a fire because it was warm. I forgave them. They were cold, and I had so much to give.”','“Not now. Not for a long time. Nobody asked, before, so nobody knew. The pain was only the binding, and the binding is gone.”','“I would like that. But not in the dark. I have been in the dark for three hundred years, and I would like to see where the light goes. Will you open the ceiling?”'][i];
  endFin('wake','Wake the Ember','The city lights without anyone feeding it. Ilyen climbs the stair for the first time in sixty years and stands in the sun with her eyes shut, tears running down her face. Corvin walks beside her with his mother’s blade, and when someone asks who he is, he says his name first, then hers. Behind them the Dungeon is only a cave, and the Ember sleeps and wakes in its own time, warm and gentle, a neighbour and not a servant.',EP('<b>The Ember:</b> '+t)+EP('Whichever you say, it asks the same in the end, and you open the ceiling. Light climbs the shaft floor by floor until it breaks into a sky that has not seen it for three hundred years.')+EP('<b>Ilyen:</b> “<i>Let it go out when it is ready.</i> She never meant the fire. She meant the sleep.” <b>Corvin:</b> “So she was right. It was ready. It was only waiting for someone to ask.”')+EP('The Ember wakes, enormous and gentle, and for one heartbeat a woman stands in the light who is not afraid of the dark. Then it chooses, on its own, to warm the city as a neighbour would, not as a servant.')); };
npcNib=function(){ Q().nib=1; saveStory(); storyOverlay(EH('Nib')+EP('A small, nervous goblin sits on a barrel by the fire, wrapped in a coat too big for him, clutching a mug of tea in both hands. He is the one who walked out of the warren last winter, and he looks as if he is waiting to be scolded.')+EP('<b>Nib:</b> “Is it true? What they are saying? That the Warchief has fallen?” You tell him how it ended, the horn, the drums, the lanterns turning toward the way up. He is quiet for a long time. “Then the door’s open.” His voice cracks. “I walked out because I could not stand the drums. I thought I was a coward. Maybe I was only early.”')+EP('He grips your hand in both of his. “I will carry word to every tunnel. Tell the warren it may go home. Tell the foreman his lads are free, and that Nib said thank you.”')+EB([['Continue','storyClose();render()']])); };
npcMarrow=function(){ Q().marrow=1; saveStory(); storyOverlay(EH('Marrow')+EP('The Ferrywoman waits at the edge of the camp, tall and pale in a cloak the colour of wet slate, a long pole across her shoulders and a lantern burning blue at her hip. Her eyes rest on the pearl in your pack as if she could see through the cloth.')+EP('<b>Marrow:</b> “The Tidal Pearl. His last breath.” She holds out one hand, and you place it in her palm. She turns it to her lantern, and the light inside it moves like water. “Yes. It is his. I have carried a great many who gave up a little of themselves, but I never carried him across. I have been waiting for this.” She closes your fingers around it again. “Keep it. I only needed to see it, so I can ferry him over when the time comes. Do not lose it. It is the lightest thing you will ever carry, and the most important.”')+EB([['Continue','storyClose();render()']])); };
})();


/* ---------- Expanded Thessaly, Hobb, altar and Ilyen floor lines ---------- */
(function(){
const T=(f,t)=>{ THES[f][2]=t; };
T(10,'The oldest line in my ledger is hers, and it is only six words long: stand watch until it is ready. I have read it ten thousand times and I still cannot tell whether she meant it as a command or a plea. The first thing the binding took was sleep, and nobody asked what “ready” meant. He kept the first ward for three hundred years because no one told him he could stop.');
T(20,'Three hundred names in a foreman’s hand, each with a wage and a date and a small tick beside it. The warren followed the fire down because Veyra asked them to, and the ticks stop in the second winter. Nobody ever told them they could come home. I think that is the saddest ledger I have ever read, because it is only careful. It is full of people who never complained.');
T(30,'His tally of coals shows the heat flowing down, not out, every night for three centuries, and the line never wavers. The fire is not simply dying. Something is drawing it, steadily, patiently, from beneath. I suspect he understood that long before anyone else, and kept feeding it anyway, because the alternative was to admit it had been pointless.');
T(40,'The pull takes the warm things first: warmth, then breath, then life. Whoever built it knew exactly what to take and in what order. Her wolves are in the records too, as a line of children’s names, which is how I know they were never really wolves at all, only the ones who would not leave her side.');
T(50,'The only protest on record. He refused the binding at the founding table, in front of the others, and was silenced for it before the oath was even sworn. His words survive in a single margin note, written in a different hand: it is not a fire, it is asleep. Someone copied them down, and then, I think, someone was afraid, and hid the page.');
T(60,'The binding does not destroy what it takes. It plants it. Every flower in that garden is a person, and he knows them all by name, and waters them anyway. Veyra did not feed the Ember. She stepped in to ease it, and I believe that is the most important sentence in the whole ledger, and nobody has been willing to read it aloud.');
T(70,'Her last words, whole: let it go out when it is ready, do not feed it, do not be afraid of the dark. Everything else, every oath, every binding, every sacrifice, is a misreading of that. The Minotaur remembered it perfectly. No one believed him because remembering something perfectly does not make it comfortable.');
T(80,'The founding oath, ten lines in ten hands, each one ending the same way: we will feed the fire until it is safe. Not one of them defined safe. I have gone through the paper with a lens, looking for a footnote, a definition, any hint of an exit. There is none. They were frightened people writing a promise with no end, and the Storm carried it for three hundred years.');
T(90,'The promise that each gift would be returned was a lie. I found the original draft, and the line is crossed out, then rewritten, then crossed out again. The Sovereign never meant to give anything back. But the Emperor believed him anyway, and I think that is not a failure of intelligence. It is a failure of the people who made him need to believe.');
T(100,'His name was Orren, and he was her oldest friend. His handwriting is on every page, long before anyone called him Sovereign. Everything he did was grief that could not hear the word rest. I want to be angry with him, and I find I cannot. I have only ever seen one person try so hard to keep something from ending.');
RUMOURS.splice(0,9,
'The lanterns in the Hollow Ward burn without oil, and nobody can say when they began. Someone saw a child hold her hand to one and say, “It is warm like Grandmother’s kitchen,” and the flame leaned toward her.',
'The goblin drums have stopped, all at once, and for the first time anyone can remember the warren is silent. Nobody knows why. A few of the older delvers say it sounds like a held breath.',
'Someone says the Ember is warm at the bottom, not hot. A dying delver told a camp cook that the deeper she went, the more it felt like being held. Nobody believed her. She was very calm.',
'The wolves have started to sleep. An old trapper says they curl up in rings now, as if waiting for something, and that the biggest one keeps looking at the stair.',
'Marrow says the water remembers every name that has ever been spoken near it. She says that if you are quiet enough, at night, you can hear them all, very softly, like a long conversation in another room.',
'The roses grew back overnight, white, along the edge of the garden path. A boy who picked one says it whispered his mother’s name. He has not slept since, and he does not seem unhappy.',
'A mirror in the maze cracked from the inside, and the delver who saw it swears the face in the glass was not his own. It looked kind, he says, and very tired.',
'The storm stopped for a whole minute once, and in the silence someone heard a voice say, very quietly, “Please.” Then the thunder came back, louder than before, as if embarrassed.',
'At the edge of the Abyss, the dark has weight. You can lean on it. A girl at camp says she did, and for a moment it held her up like a hand, and she has been trying to forget the feeling ever since.');
HOBB_HINTS.splice(0,9,
'“The knight at the first ward has stood there so long he has forgotten who he waits for. Let him talk. He is lonelier than he looks, and he hasn’t had a proper conversation in three hundred years.”',
'“The goblins are tired, not cruel. Their foreman keeps a ledger and he is not as hard as he sounds. If you stand where he can see you and say the right thing, you will find a man who wants to go home.”',
'“The Warden down there feeds a fire with his bare hands. Ask him about the heat, and where it goes. He knows more than he lets on, and he will only say it if you ask quietly.”',
'“Wolves love her, and she loves them back. Ask her about the cold before you raise a blade. And if one of the wolves comes close, do not flinch. They are only checking you are warm.”',
'“There is a bright thing in the king’s hall that looks like a pearl. Wait for his words. He needs a long while to say them, and every one is worth the wait. He is not rude, he is only out of breath.”',
'“Do not trample the little ones. Every one of them was somebody. The gardener is the gentlest thing in the whole Dungeon, and if you are kind to him, he will tell you a thing that will change how you see the rest.”',
'“Speak up in the mirror room. Voices do not lie there, and neither do faces. The one who sits at the end remembers her last words. Listen to him. He has been trying to tell someone for three hundred years.”',
'“The storm is loud, but it is listening. Stand still, and say something true, and he will lower his voice. I think he has been shouting so no one would hear that he was afraid.”',
'“Last rumour, and the strangest: the dark at the bottom has weight, and the altar has been talking to you longer than you think. Be careful what you say yes to. Be kind to whoever is waiting at the end, even if he is not who you expected.”');
const IF={8:'Somewhere above, a woman hums a tune you almost know. It stops when you listen for it, and starts again when you do not. The air smells faintly of tea.',16:'The air is warmer for a moment, as if someone is tending a fire nearby. You catch a glimpse of grey cloth at the corner of the passage, and a hand disappearing around the bend.',24:'You smell tea, faintly, and then it is gone. A single cup sits on a ledge, still warm, and you have the strong, ridiculous sense that it was left for you.',32:'Footprints in the dust, small ones, going down. They are fresh, and they are very careful, and they do not stop until they reach the edge of the next stair.',40:'A grey cloak hangs on a hook where no hook should be. When you look back, it is gone, and the hook with it, and the wall is plain stone again.',48:'The wall is faintly warm under your hand. It sounds like someone breathing slowly, very patiently, on the other side of the stone.',56:'You hear someone say a name, somewhere out of sight. It sounds like it hurts to say, and like she has said it a thousand times, and like she will say it a thousand more.',64:'A cup of tea sits on a ledge, still steaming, with a folded note beside it. The note is blank, but the paper smells of woodsmoke and old books.',72:'The lanterns here have been lit by hand, and recently, and each one is trimmed with a care that makes you think of someone who has done it every night for decades.',80:'Somewhere a woman whispers, “almost there,” and you cannot tell whether she is speaking to you or to herself.',88:'A pair of old boots rests by the stair, neatly placed, soles worn thin. They look like they have been waiting a very long time for someone to come back for them.',96:'Silence, and the sense that someone is waiting at the bottom, standing very still, listening for your footsteps.'};
Object.assign(ILY_FLOOR,IF);
const _av2=altarVoice; altarVoice=function(){ const n=STORY.altar; if(STORY.crowned) return 'The voice is yours now, warm and patient: “Of course. It is only a little. You have always known what to do.”';
  return n<2?'A warmth answers, soft as breath on your neck: “Generous. Most only ever take.”':n<3?'The stone hums, pleased: “You do not hesitate. I like that. It makes everything easier.”':n<5?'The stone murmurs, almost fondly: “Again. You learn quickly. You are the first in a long time who truly understands what I am offering.”':n<7?'The voice speaks your name, as if it had always known it. “The next is only habit. Do you not feel how easy it is?”':'The voice is very close now, very warm: “You have said yes so many times that I cannot tell where you end and I begin. Is that not a gift?”'; };

function bellFarewell(){
  if(window.__bf) return; window.__bf = 1; storyClose();
  try{ saveGame(); saveStory(); }catch(e){}
  const st = document.createElement('style');
  st.textContent = '#bfov{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:rgba(6,8,16,.93);padding:20px;transition:background 2s}'
  + '#bfov .bfb{max-width:540px;text-align:center;color:#cfe8ff;font:20px/1.7 Georgia,serif;text-shadow:0 0 14px #7ac8ff;transition:opacity 2.2s,filter 2.2s}'
  + '#bfov .nm{font:12px monospace;letter-spacing:.35em;color:#7ac8ff;text-transform:uppercase;margin-bottom:14px}'
  + '#bfblk{position:fixed;inset:0;z-index:2147483600;background:transparent}'
  + '#bfscan{position:fixed;inset:0;z-index:2147483100;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}'
  + '@keyframes bfj{0%{transform:translate(0,0)}20%{transform:translate(-4px,2px) skewX(1deg)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-5px) skewX(-2deg)}80%{transform:translate(4px,4px)}100%{transform:translate(0,0)}}'
  + '@keyframes bft{0%,100%{clip-path:inset(0 0 0 0)}25%{clip-path:inset(12% 0 55% 0)}50%{clip-path:inset(60% 0 8% 0)}75%{clip-path:inset(30% 0 30% 0)}}'
  + 'body.bfg1>*:not(#bfov):not(#bfblk):not(#bfscan){animation:bfj .3s steps(2) infinite}'
  + 'body.bfg2>*:not(#bfov):not(#bfblk):not(#bfscan){animation:bfj .2s steps(2) infinite;filter:hue-rotate(40deg) saturate(1.6)}'
  + 'body.bfg3>*:not(#bfov):not(#bfblk):not(#bfscan){animation:bfj .14s steps(2) infinite;filter:hue-rotate(110deg) contrast(1.4) drop-shadow(6px 0 0 rgba(255,0,60,.6)) drop-shadow(-6px 0 0 rgba(0,200,255,.6))}'
  + 'body.bfg4>*:not(#bfov):not(#bfblk):not(#bfscan){animation:bfj .09s steps(2) infinite,bft .5s steps(1) infinite;filter:invert(.85) hue-rotate(200deg) contrast(1.8)}'
  + 'body.bfg5>*:not(#bfov):not(#bfblk):not(#bfscan){animation:bfj .05s steps(2) infinite,bft .22s steps(1) infinite;filter:invert(1) contrast(3) saturate(0)}';
  document.head.appendChild(st);
  const blk = document.createElement('div'); blk.id = 'bfblk'; document.body.appendChild(blk);
  ['keydown','keyup','keypress'].forEach(k => document.addEventListener(k, e => { e.stopPropagation(); e.preventDefault(); }, true));
  let ac = null, ng = null;
  try{ ac = new (window.AudioContext || window.webkitAudioContext)(); const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    const s = ac.createBufferSource(); s.buffer = b; s.loop = true; ng = ac.createGain(); ng.gain.value = 0; s.connect(ng); ng.connect(ac.destination); s.start(); }catch(e){}
  const noise = v => { try{ ng.gain.value = v; }catch(e){} };
  const ov = document.createElement('div'); ov.id = 'bfov';
  const msg = 'Farewell adventurer! Perhaps we will meet again. I hope you had fun. Ohh seems like the world didn’t take the fight so well…';
  ov.innerHTML = '<div class="bfb"><div class="nm">Bell, the Maker</div><div id="bft"></div></div>';
  document.body.appendChild(ov);
  const sc = document.createElement('div'); sc.id = 'bfscan'; document.body.appendChild(sc);
  let i = 0; const out = document.getElementById('bft');
  const GL = '█▓▒░#@%&?¿Ω∆ǂ¤§';
  function corrupt(n){
    const els = Array.from(document.body.querySelectorAll('*')).filter(el => !el.closest('#bfov,#bfblk,#bfscan,style,script') && el.children.length === 0 && el.textContent && el.textContent.trim().length);
    for(let k = 0; k < n && els.length; k++){
      const el = els[Math.floor(Math.random()*els.length)], t = el.textContent.split('');
      for(let c = 0; c < 1 + Math.floor(t.length*0.25); c++){ const j = Math.floor(Math.random()*t.length); if(t[j] !== ' ') t[j] = GL[Math.floor(Math.random()*GL.length)]; }
      el.textContent = t.join('');
    }
  }
  function type(){
    if(i < msg.length){ out.textContent += msg[i++]; setTimeout(type, 38); }
    else setTimeout(vanish, 2200);
  }
  function vanish(){
    const b = ov.querySelector('.bfb'); b.style.opacity = 0; b.style.filter = 'blur(10px)';
    ov.style.background = 'rgba(6,8,16,0)';
    setTimeout(() => { ov.remove(); glitch(1); }, 2400);
  }
  function glitch(stage){
    document.body.classList.remove('bfg' + (stage - 1)); document.body.classList.add('bfg' + stage);
    sc.style.opacity = Math.min(1, (stage - 1)*0.3);
    noise([0, 0.01, 0.03, 0.07, 0.14, 0.3][stage]);
    const t0 = Date.now(), len = 4200;
    const iv = setInterval(() => {
      corrupt(stage*stage*2);
      if(stage >= 3 && Math.random() < 0.3){ document.body.style.opacity = 0.2; setTimeout(() => document.body.style.opacity = 1, 60); }
      if(Date.now() - t0 > len){ clearInterval(iv); if(stage < 5) glitch(stage + 1); else darkness(); }
    }, Math.max(60, 420 - stage*70));
  }
  function darkness(){
    noise(0); try{ ac.close(); }catch(e){}
    document.body.className = ''; document.body.style.opacity = 1;
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:2147483500;background:#000;display:flex;align-items:center;justify-content:center;color:#9aa4b8;font:24px/1.6 Georgia,serif;letter-spacing:.12em;text-align:center;opacity:1';
    d.innerHTML = '<span id="bfm" style="opacity:0;transition:opacity 2.5s">Watch out for the moon.</span>';
    document.body.appendChild(d);
    setTimeout(() => { document.getElementById('bfm').style.opacity = 1; }, 900);
    setTimeout(finish, 10000);
  }
  function finish(){
    try{ STORY.moonWarned = 1; saveStory(); saveGame(); }catch(e){}
    try{ window.close(); }catch(e){}
    setTimeout(() => { document.documentElement.innerHTML = '<body style="background:#000;margin:0"></body>'; document.title = ''; try{ window.stop(); }catch(e){} }, 300);
  }
  type();
}

const KIT_SVG = '<img id="kitimg" alt="Kitsune" src="' + KIT_IMGS.sleep + '">';
const KIT = [
 {s:'You touch the moon and it unfolds like a paper lantern. A path of cold silver runs down into the tavern, to the table behind the barrels. Where Bell sat, something small is curled up on the bench: a fox, nine white-tipped tails wrapped around it like a blanket.',
  q:'<b>Bell:</b> “Ah. You heard the warning, and you looked anyway. Of course you did.”',
  o:[['“Bell? You’re a fox?”','<b>Bell:</b> “A kitsune, if we are being proper. The man with ink on his fingers was a coat I wore. It was a good coat. It had pockets.”'],
     ['“What was that about the moon?”','<b>Bell:</b> “The moon is where I keep everything I did not write. When you beat me, the stitches pulled. I thought someone should be warned.”'],
     ['“You’re adorable.”','<b>Bell:</b> “I am an ancient being of nine tails and terrible craft.” <i>The tails wag. Once. Twice.</i> “…Say it again.”']]},
 {s:'The fox stretches, yawns, and rests its chin on its paws. The tavern is very quiet.',
  q:'<b>Bell:</b> “I will tell you the truth, which is rarer than a lie from my kind. I was lonely. A fox with a great many nights and nothing to do makes up a stair, and then a floor, and then a rat to live on it, so that somebody is down there.”',
  o:[['“So the Dungeon was a bedtime story?”','<b>Bell:</b> “A very large one. Ten Keepers, a fire that was really a sleeper, a Sovereign who could not let go of a promise, a boy called Corvin who wanted to be seen. They are all the same lonely night, told ten ways.”'],
     ['“Then why make it so hard?”','<b>Bell:</b> “Because easy things are not remembered. Not by you, and not by me.”'],
     ['“I’m sorry you were lonely.”','<b>Bell:</b> “…Do not be kind to me so suddenly. My tails are puffing up.”']]},
 {s:'The fox lifts its head and looks at you for a long moment, the way you look at a candle you have decided not to blow out.',
  q:'<b>Bell:</b> “As for the glitching: when you beat the one who wrote the rules, the rules shook. That is all. The world is fine.” <i>A small pause.</i> “The moon was mostly a joke. Mostly.”',
  o:[['“Mostly?”','<b>Bell:</b> “Foxes keep a few secrets, little delver. It is a professional requirement.”'],
     ['“I’ll keep an eye on it.”','<b>Bell:</b> “Good. Somebody should. I am retiring.”']]},
 {s:'The fox hops onto the table, then onto your shoulder, then back down, apparently unable to decide how much dignity it can afford.',
  q:'<b>Bell:</b> “I have no more floors to write. Would you mind if I stayed? I would like to sit by a fire and watch someone else carry the story for a while.”',
  o:[['“Stay as long as you like.”','<b>Bell:</b> “…Thank you.” <i>One tail curls around your wrist, very briefly, and lets go.</i>'],
     ['“Only if you keep the bench warm.”','<b>Bell:</b> “I have kept worlds warm. A bench will be easy.”'],
     ['“Do you eat the rats?”','<b>Bell:</b> “I am not dignified enough to answer that, and you know it.”']]}
];
function moonSync(){
  const on = S.screen === 'title' && STORY.moonWarned && !STORY.kitsune, m = document.getElementById('moonbtn');
  if(on && !m){ const b = document.createElement('button'); b.id = 'moonbtn'; b.setAttribute('aria-label', 'The moon'); b.onclick = moonOpen; document.body.appendChild(b); }
  else if(!on && m) m.remove();
  const cv = document.querySelector('canvas.scene-art[data-scene="tavern"]');
  if(S.screen === 'tavern' && STORY.kitsune && cv && !document.getElementById('kit')){
    const w = document.createElement('div'); w.id = 'kitwrap'; w.style.cssText = 'position:relative;width:min(100%,360px);margin:0 auto;line-height:0';
    cv.parentNode.insertBefore(w, cv); w.appendChild(cv); cv.style.width = '100%';
    const k = document.createElement('div'); k.id = 'kit'; k.innerHTML = KIT_SVG; k.onclick = kitPet; k.style.left = '24%'; k.style.bottom = '1%'; w.appendChild(k);
  }
  kitFit();
  if(!window._kitRs){ window._kitRs = 1; window.addEventListener('resize', kitFit); }
}
function kitFit(){ const im = document.getElementById('kitimg'), c = document.querySelector('canvas.scene-art[data-scene="tavern"]'); if(im && c && c.clientHeight) im.style.height = Math.round(c.clientHeight * 0.27 * 1.3542) + 'px'; }
function moonOpen(){ if(!STORY.moonWarned || STORY.kitsune) return; kitStep(0); }
function kitStep(i){ const k = KIT[i];
  storyOverlay(EH(i === 0 ? 'The Moon' : 'Bell') + EP('<i>' + k.s + '</i>') + EP(k.q) + EB(k.o.map((o, j) => [o[0], 'kitPick(' + i + ',' + j + ')'])));
}
function kitPick(i, j){
  storyOverlay(EH('Bell') + EP(KIT[i].o[j][1]) + EB([[i + 1 < KIT.length ? 'Continue' : 'Finish', i + 1 < KIT.length ? 'kitStep(' + (i + 1) + ')' : 'kitDone()', 1]]));
}
function kitDone(){
  STORY.kitsune = 1; saveStory(); try{ saveGame(); }catch(e){}
  storyOverlay(EH('A small guest') + EP('<i>The silver path folds up behind you, and the moon dims to an ordinary moon. Back in the tavern, a fox with nine tails has taken the warm end of the bench and is pretending, very badly, not to be a god.</i>') + EP('<span style="color:var(--ember-bright)">A kitsune now lives in The Guttering Lantern.</span>') + EB([['Continue', 'storyClose();render()', 1]]));
}
const _KL = ['<i>The kitsune’s ears swivel toward you. He pretends he was already looking.</i>','<b>Bell:</b> “Do not tell the rats I am here.”','<i>The tails wag, one by one, like a slow wave.</i>','<b>Bell:</b> “This bench is the best floor I ever wrote.”','<i>A tiny blue flame bobs over his head and settles on your sleeve for a moment.</i>'];
let _kitPose = 0, _kitT = 0;
function kitPet(){ const im = document.getElementById('kitimg'); if(im){ _kitPose = (_kitPose + 1) % 3; im.src = KIT_IMGS[['sleep','sit','back'][_kitPose]]; clearTimeout(_kitT); _kitT = setTimeout(function(){ _kitPose = 0; im.src = KIT_IMGS.sleep; }, 9000); } storyOverlay(EH('The Kitsune') + EP(_KL[Math.floor(Math.random()*_KL.length)]) + EB([['Continue', 'storyClose()', 1]])); }
const _bellScene0 = bellScene; bellScene = function(){ if(STORY.kitsune){ kitPet(); return; } return _bellScene0.apply(this, arguments); };
const _render11 = render; render = function(){ const r = _render11.apply(this, arguments); try{ moonSync(); }catch(e){} return r; };
try{ moonSync(); }catch(e){}

</script>
