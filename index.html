<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Emberdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14100d;
    --bg-panel:#1e1712;
    --bg-inset:#100c09;
    --border:#3a2e22;
    --border-lit:#5c4527;
    --ember:#c98a3e;
    --ember-bright:#e3a855;
    --moss:#4e7c6b;
    --moss-bright:#6fa38f;
    --blood:#a6432d;
    --blood-bright:#c65a3f;
    --text:#e9dfc9;
    --text-muted:#a9998a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-y:auto; height:auto;}
  .scrollbox{ display:flex; flex-direction:column; gap:8px; max-height:46vh; overflow-y:auto; padding-right:4px; -webkit-overflow-scrolling:touch; }
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,138,62,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Crimson Text', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px;
  }
  h1,h2,h3,.display{
    font-family:'Cinzel', serif;
    letter-spacing:0.02em;
    margin:0;
  }
  #app{ width:100%; max-width:520px; }
  .frame{
    background:var(--bg-panel);
    border:1px solid var(--border);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.03),
      0 10px 30px rgba(0,0,0,0.5);
    padding:22px 22px 20px;
  }
  .title-wrap{ text-align:center; padding:38px 10px 10px; }
  .title-wrap h1{ font-size:2.3em; color:var(--ember-bright); text-shadow:0 0 18px rgba(227,168,85,0.35); }
  .title-wrap .sub{ color:var(--text-muted); font-style:italic; margin-top:10px; font-size:1.05em; }
  .torch-row{ display:flex; justify-content:center; gap:26px; margin:26px 0 30px; }
  .torch{ width:14px; height:34px; position:relative; }
  .torch .flame{
    width:12px;height:20px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:linear-gradient(180deg, var(--ember-bright), var(--blood) 80%);
    margin:0 auto;
    animation:flicker 1.6s infinite ease-in-out;
  }
  .torch .stick{ width:4px;height:16px;background:#4a3a28; margin:0 auto; }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) scaleX(1); opacity:1; }
    30%{ transform:scaleY(1.12) scaleX(0.92); opacity:0.9; }
    55%{ transform:scaleY(0.9) scaleX(1.05); opacity:1; }
    80%{ transform:scaleY(1.05) scaleX(0.96); opacity:0.95; }
  }
  button{
    font-family:'Cinzel', serif;
    font-size:0.8em;
    letter-spacing:0.03em;
    background:var(--bg-inset);
    color:var(--text);
    border:1px solid var(--border-lit);
    padding:12px 14px;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover:not(:disabled){ background:#2a2119; border-color:var(--ember); color:var(--ember-bright); }
  button:disabled{ opacity:0.35; cursor:default; }
  button.primary{ border-color:var(--ember); color:var(--ember-bright); }
  button.primary:hover:not(:disabled){ background:#33261a; }
  .btn-col{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }

  .statusbar{ display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .statusbar .name{ font-size:1.05em; color:var(--ember-bright); }
  .statusbar .lvl{ color:var(--text-muted); font-size:0.85em; margin-top:2px; }
  .statusbar .gold{ font-family:'Cinzel',serif; font-size:0.85em; color:var(--ember); text-align:right; }
  .bars{ margin-top:10px; }
  .bar-label{ display:flex; justify-content:space-between; font-size:0.78em; color:var(--text-muted); margin-bottom:3px; }
  .bar-track{ height:8px; background:var(--bg-inset); border:1px solid var(--border); margin-bottom:8px; }
  .bar-fill{ height:100%; transition:width 0.35s ease; }
  .bar-fill.hp{ background:linear-gradient(90deg, var(--blood), var(--blood-bright)); }
  .bar-fill.mp{ background:linear-gradient(90deg, #3d6357, var(--moss-bright)); }
  .bar-fill.xp{ background:linear-gradient(90deg, #8a6224, var(--ember)); }

  .stage{
    background: radial-gradient(ellipse at 50% 30%, rgba(201,138,62,0.12), transparent 65%), var(--bg-inset);
    border:1px solid var(--border);
    padding:18px;
    display:flex; flex-direction:column; align-items:center;
    margin-bottom:16px;
  }
  .stage svg{ width:170px; height:170px; }
  .room-title{ margin-top:8px; font-size:1.15em; color:var(--ember-bright); text-align:center; }
  .room-sub{ font-size:0.9em; color:var(--text-muted); text-align:center; margin-top:4px; font-style:italic; }
  .enemy-hp-wrap{ width:100%; margin-top:10px; }
  .enemy-hp-wrap .bar-label{ color:var(--text); }

  .log{
    background:var(--bg-inset); border:1px solid var(--border); padding:10px 12px; height:112px;
    overflow-y:auto; font-size:0.86em; color:var(--text-muted); margin-bottom:14px;
    display:flex; flex-direction:column-reverse;
  }
  .log p{ margin:2px 0; }
  .log p.hit{ color:var(--blood-bright); }
  .log p.good{ color:var(--moss-bright); }
  .log p.info{ color:var(--ember); }

  .end-wrap{ text-align:center; padding:20px 6px 6px; }
  .end-wrap h2{ font-size:1.6em; margin-bottom:10px; }
  .stat-list{ text-align:left; margin:18px auto; max-width:260px; font-size:0.95em; color:var(--text-muted); }
  .stat-list div{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--border); }

  .class-card{
    border:1px solid var(--border); background:var(--bg-inset); padding:14px 16px; margin-bottom:12px; text-align:left;
    cursor:pointer; transition:border-color 0.15s, background 0.15s;
  }
  .class-card:hover{ border-color:var(--ember); background:#1a140d; }
  .class-card h3{ color:var(--ember-bright); font-size:1.05em; }
  .class-card .stats{ color:var(--text-muted); font-size:0.82em; margin:6px 0 8px; }
  .class-card .skill{ font-size:0.85em; margin-top:4px; }
  .class-card .skill b{ color:var(--moss-bright); font-family:'Cinzel',serif; font-weight:500; font-size:0.92em; }


  .frame{ position:relative; }
  .stage{ position:relative; }
  .btn-row button:last-child:nth-child(odd){ grid-column:1 / -1; }
  .tags{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; min-height:22px; margin-top:8px; }
  .tags:empty{ min-height:0; margin-top:0; }
  .tag{ font-family:'Cinzel',serif; font-size:0.7em; letter-spacing:0.04em; padding:2px 8px; border:1px solid var(--border-lit); background:var(--bg-inset); }
  .tag.poison{ color:var(--moss-bright); border-color:var(--moss); }
  .tag.burn{ color:var(--ember-bright); border-color:var(--ember); }
  .tag.stun{ color:var(--text); border-color:var(--text-muted); }

  .float{
    position:absolute; left:50%; z-index:5; pointer-events:none; opacity:0;
    font-family:'Cinzel',serif; font-weight:700; font-size:1.5em; text-shadow:0 2px 6px #000;
    animation:floatUp 1s ease-out forwards;
  }
  .float.enemy{ top:26%; }
  .float.player{ top:70px; left:57%; }
  .float.dmg{ color:var(--ember-bright); }
  .float.hurt{ color:var(--blood-bright); }
  .float.swing{ color:var(--text-muted); font-style:italic; }
  .float.heal{ color:var(--moss-bright); }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,10px) scale(0.8); }
    15%{ opacity:1; transform:translate(-50%,0) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-46px) scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(3px); }
  }
  @keyframes hurtFlash{
    0%{ box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4), inset 0 0 70px rgba(198,90,63,0.6), 0 10px 30px rgba(0,0,0,0.5); }
    100%{ box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4), inset 0 0 0 rgba(198,90,63,0), 0 10px 30px rgba(0,0,0,0.5); }
  }
  .hit-enemy svg{ animation:shake 0.32s; }
  .hit-player{ animation:hurtFlash 0.5s ease-out; }

  /* ---- enemy art animation ---- */
  .stage{ background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--glow, #c98a3e) 24%, transparent), transparent 65%), var(--bg-inset); }
  .stage.bossfight{ box-shadow: inset 0 0 60px color-mix(in srgb, var(--glow, #c98a3e) 22%, transparent); }
  .stage.bossfight .room-title{ font-size:1.4em; letter-spacing:0.08em; text-shadow:0 0 14px var(--glow, #e3a855); }
  .stage svg.art{ overflow:visible; }
  .stage svg.boss{ width:230px; height:230px; }
  .art .bob,.art .float,.art .float2,.art .pulse,.art .breathe,.art .sway,.art .sway2,.art .cape,.art .wingL,.art .wingR,.art .tail,.art .flick,.art .rise,.art .wisp,.art .spin,.art .spin2,.art .halo,.art .halo2,.art .orb,.art .core,.art .sword,.art .armL,.art .armR,.art .head,.art .tongue,.art .eye,.art .glowline,.art .spark,.art .aura{ transform-box:fill-box; transform-origin:center; }
  .art .bob{ animation:aBob 3.2s ease-in-out infinite; }
  .art .float{ animation:aFloat 3.8s ease-in-out infinite; }
  .art .float2{ animation:aFloat 5s ease-in-out infinite; }
  .art .pulse{ animation:aPulse 2.6s ease-in-out infinite; transform-origin:50% 100%; }
  .art .breathe{ animation:aBreathe 3.4s ease-in-out infinite; transform-origin:50% 100%; }
  .art .sway{ animation:aSway 3s ease-in-out infinite; transform-origin:50% 0%; }
  .art .sway2{ animation:aSway2 4.4s ease-in-out infinite; transform-origin:50% 100%; }
  .art .cape{ animation:aCape 3.8s ease-in-out infinite; transform-origin:50% 0%; }
  .art .wingL{ animation:aWingL 1.3s ease-in-out infinite; transform-origin:100% 60%; }
  .art .wingR{ animation:aWingR 1.3s ease-in-out infinite; transform-origin:0% 60%; }
  .art .tail{ animation:aTail 2.4s ease-in-out infinite; transform-origin:0% 50%; }
  .art .eye{ animation:aEye 2.6s ease-in-out infinite; }
  .art .flick{ animation:aFlick 0.55s ease-in-out infinite; transform-origin:50% 100%; }
  .art .glowline{ animation:aGlow 1.8s ease-in-out infinite; }
  .art .spark{ animation:aSpark 1.6s steps(1) infinite; }
  .art .rise{ animation:aRise 3.4s ease-in-out infinite; }
  .art .wisp{ animation:aRise 2.8s ease-in-out infinite; }
  .art .spin{ animation:aSpin 7s linear infinite; }
  .art .spin2{ animation:aSpin 22s linear infinite; }
  .art .halo{ animation:aSpin 30s linear infinite; }
  .art .halo2{ animation:aSpin 18s linear infinite reverse; }
  .art .aura{ animation:aAura 3.2s ease-in-out infinite; }
  .art .orb, .art .core{ animation:aCore 1.8s ease-in-out infinite; }
  .art .sword{ animation:aSword 3.6s ease-in-out infinite; transform-origin:50% 100%; }
  .art .armL{ animation:aArm 3.4s ease-in-out infinite; transform-origin:50% 0%; }
  .art .armR{ animation:aArm 3.4s ease-in-out infinite reverse; transform-origin:50% 0%; }
  .art .head{ animation:aHead 4.2s ease-in-out infinite; transform-origin:50% 100%; }
  .art .tongue{ animation:aTongue 2.8s ease-in-out infinite; transform-origin:50% 0%; }
  @keyframes aBob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} }
  @keyframes aFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes aPulse{ 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.04,0.95)} }
  @keyframes aBreathe{ 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,1.025)} }
  @keyframes aSway{ 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes aSway2{ 0%,100%{transform:rotate(-1.6deg) translateX(-1px)} 50%{transform:rotate(1.6deg) translateX(1px)} }
  @keyframes aCape{ 0%,100%{transform:skewX(-1.5deg)} 50%{transform:skewX(1.8deg) scaleY(1.01)} }
  @keyframes aWingL{ 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(7deg)} }
  @keyframes aWingR{ 0%,100%{transform:rotate(9deg)} 50%{transform:rotate(-7deg)} }
  @keyframes aTail{ 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(6deg)} }
  @keyframes aEye{ 0%,100%{opacity:0.72} 50%{opacity:1} }
  @keyframes aFlick{ 0%,100%{transform:scale(1,1) skewX(0)} 33%{transform:scale(0.96,1.09) skewX(2deg)} 66%{transform:scale(1.03,0.94) skewX(-2deg)} }
  @keyframes aGlow{ 0%,100%{opacity:0.55} 50%{opacity:1} }
  @keyframes aSpark{ 0%,100%{opacity:1} 8%{opacity:0} 16%{opacity:1} 58%{opacity:1} 62%{opacity:0.15} 66%{opacity:1} 80%{opacity:0.4} 84%{opacity:1} }
  @keyframes aRise{ 0%,100%{transform:translateY(2px);opacity:0.55} 50%{transform:translateY(-8px);opacity:1} }
  @keyframes aSpin{ to{transform:rotate(360deg)} }
  @keyframes aAura{ 0%,100%{opacity:0.22} 50%{opacity:0.42} }
  @keyframes aCore{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.16)} }
  @keyframes aSword{ 0%,100%{transform:rotate(-1.6deg)} 50%{transform:rotate(1.6deg)} }
  @keyframes aArm{ 0%,100%{transform:translateY(0) rotate(0.6deg)} 50%{transform:translateY(2px) rotate(-0.6deg)} }
  @keyframes aHead{ 0%,100%{transform:rotate(-0.8deg) translateY(0)} 50%{transform:rotate(0.8deg) translateY(-1px)} }
  @keyframes aTongue{ 0%,70%,100%{transform:scaleY(1)} 80%{transform:scaleY(1.5)} }
  /* wind-up: the enemy rears back and glows while charging a heavy hit */
  @keyframes aCharge{ 0%,100%{transform:translate(0,0) scale(1.05); filter:drop-shadow(0 0 8px #ff5a2a) brightness(1.1)} 25%{transform:translate(-2px,1px) scale(1.09)} 50%{transform:translate(0,-2px) scale(1.07); filter:drop-shadow(0 0 16px #ff3a1a) brightness(1.3)} 75%{transform:translate(2px,1px) scale(1.09)} }
  .stage.charging svg.art{ animation:aCharge 0.5s ease-in-out infinite; }
  .stage.charging.hit-enemy svg.art{ animation:shake 0.32s; }
  /* enemy lunges at you when it hits */
  @keyframes aLunge{ 0%{transform:translateY(0) scale(1)} 35%{transform:translateY(14px) scale(1.16)} 100%{transform:translateY(0) scale(1)} }
  .frame.hit-player .stage svg.art{ animation:aLunge 0.42s ease-out; }
  .frame.hit-player .stage.hit-enemy svg.art{ animation:shake 0.32s, aLunge 0.42s ease-out 0.34s; }
  .stage.wounded svg.art{ filter:saturate(0.85) drop-shadow(0 0 6px rgba(198,90,63,0.9)); }
  /* death: the foe flashes and dissolves */
  .death-fx{ position:fixed; z-index:60; pointer-events:none; animation:aDeath 0.9s ease-out forwards; }
  .death-fx.boss{ animation:aDeathBoss 1.5s ease-out forwards; }
  .death-fx svg{ width:100%; height:100%; overflow:visible; }
  .death-fx *{ animation:none !important; }
  @keyframes aDeath{ 0%{opacity:1; filter:brightness(2.4)} 30%{opacity:1; filter:brightness(3) saturate(0)} 100%{opacity:0; transform:scale(1.2) translateY(-18px); filter:brightness(4) blur(5px)} }
  @keyframes aDeathBoss{ 0%{opacity:1; filter:brightness(2)} 10%{transform:translateX(-5px)} 20%{transform:translateX(5px); filter:brightness(3.2) saturate(0)} 30%{transform:translateX(-4px)} 40%{transform:translateX(3px)} 55%{opacity:1; filter:brightness(4) saturate(0)} 100%{opacity:0; transform:scale(1.35) translateY(-30px); filter:brightness(6) blur(10px)} }

  /* ---- help guide and tips ---- */
  .tipcard{ border:1px solid var(--ember); background:linear-gradient(180deg, rgba(201,138,62,0.14), rgba(201,138,62,0.04)); padding:10px 12px; margin:0 0 12px; text-align:left; }
  .tiptitle{ font-family:'Cinzel',serif; color:var(--ember-bright); font-size:0.95em; letter-spacing:0.04em; margin-bottom:4px; }
  .tipbody{ font-size:0.9em; color:var(--text); line-height:1.4; }
  .tipbtns{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tipbtns .mini{ width:auto; padding:4px 12px; }
  .helplink{ text-align:center; margin:10px 0 4px; }
  .helplink a{ color:var(--text-muted); font-size:0.85em; cursor:pointer; border-bottom:1px dotted var(--border-lit); }
  .helplink a:hover{ color:var(--ember-bright); }
  .hsec{ border:1px solid var(--border); background:var(--bg-inset); margin-bottom:8px; }
  .hsec > button{ width:100%; text-align:left; background:transparent; border:0; padding:10px 14px; display:flex; justify-content:space-between; font-family:'Cinzel',serif; color:var(--ember-bright); cursor:pointer; }
  .hsec .hbody{ padding:0 14px 12px; font-size:0.92em; color:var(--text); line-height:1.45; text-align:left; }
  .hsec .hbody p{ margin:0 0 8px; }
  .hlist .hrow{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed var(--border); font-size:0.9em; }
  .hlist .hrow span:first-child{ color:var(--ember-bright); white-space:nowrap; }
  .hlist .hrow span:last-child{ color:var(--text-muted); text-align:right; }
  .frame.pg{ animation:pgIn .42s cubic-bezier(.2,.7,.2,1) both; }
  .frame.pg.enter-battle{ animation:pgBattle .5s cubic-bezier(.2,.7,.2,1) both; }
  .frame.pg.enter-delve{ animation:pgDelve .45s cubic-bezier(.2,.7,.2,1) both; }
  .pg-item{ animation:pgItem .4s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 45ms + 120ms); }
  @keyframes pgIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  @keyframes pgDelve{ from{ opacity:0; transform:translateY(10px) scale(.985); filter:brightness(.55); } to{ opacity:1; transform:none; filter:none; } }
  @keyframes pgBattle{ 0%{ opacity:0; transform:scale(1.04); filter:brightness(2.2) saturate(.5); } 40%{ opacity:1; filter:brightness(1.3); } 100%{ opacity:1; transform:none; filter:none; } }
  @keyframes pgItem{ from{ opacity:0; transform:translateX(-10px); } to{ opacity:1; transform:none; } }
  /* sprite enemies: 9x4 atlas, frames switched with steps() */
  .spr{ width:min(300px,94%); aspect-ratio:3/2; background-image:var(--spr); background-repeat:no-repeat; background-size:900% 400%; background-position:0% 0%; image-rendering:pixelated; filter:var(--tint,); animation:sprIdle 1.5s steps(9) infinite; }
  @keyframes sprIdle{ from{background-position:0% 0%} to{background-position:112.5% 0%} }
  @keyframes sprAtk{ from{background-position:0% 33.333%} to{background-position:112.5% 33.333%} }
  @keyframes sprHit{ from{background-position:0% 66.667%} to{background-position:75% 66.667%} }
  @keyframes sprDie{ from{background-position:0% 100%} to{background-position:87.5% 100%} }
  @keyframes sprGlow{ 0%,100%{filter:drop-shadow(0 0 6px #ff5a2a) brightness(1.05)} 50%{filter:drop-shadow(0 0 14px #ff3a1a) brightness(1.3)} }
  .stage .spr{ margin:0 auto; }
  .stage.charging .spr{ animation:sprIdle .8s steps(9) infinite, sprGlow .5s ease-in-out infinite; }
  .stage.hit-enemy .spr{ animation:sprHit .42s steps(6) 1, shake .32s, sprIdle 1.5s steps(9) .42s infinite; }
  .frame.hit-player .stage .spr{ animation:sprAtk .6s steps(9) 1, sprIdle 1.5s steps(9) .6s infinite; }
  .frame.hit-player .stage.hit-enemy .spr{ animation:sprHit .42s steps(6) 1, shake .32s, sprAtk .6s steps(9) .42s 1, sprIdle 1.5s steps(9) 1.02s infinite; }
  .stage.wounded .spr{ filter:var(--tint,) saturate(0.85) drop-shadow(0 0 6px rgba(198,90,63,0.9)); }
  .death-fx .spr{ width:100%; animation:sprDie .9s steps(7) forwards !important; }
  .spr-port{ position:absolute; left:8px; top:8px; width:68px; height:58px; border:1px solid var(--ember); background-size:contain; background-repeat:no-repeat; background-position:center; background-color:rgba(8,6,10,.75); filter:var(--tint,); box-shadow:0 0 10px rgba(0,0,0,.6); }
  @media (prefers-reduced-motion: reduce){ .spr, .stage .spr, .frame .stage .spr{ animation:none !important; } }
  .bst-row{ display:flex; gap:10px; align-items:flex-start; padding:8px; margin:8px 0; border:1px solid var(--border); background:var(--bg-inset); cursor:pointer; }
  .bst-row.open{ border-color:var(--ember); }
  .bst-thumb{ flex:0 0 72px; width:72px; height:72px; display:flex; align-items:center; justify-content:center; overflow:hidden; }

      {id:'frugal', name:'Frugal Alchemy', type:'passive', max:3, req:2, mods:{itemSave:12}, desc:'+12% chance per rank that a used item is not consumed.'},
      {id:'brew', name:'Quick Brew', type:'active', max:2, req:3, cost:6,
        unusable:(p)=>p.hp >= p.maxHp && Object.keys(p.status).length === 0,
        desc:r=>`Heal ${10+8*r} HP plus 10% of your max HP and cleanse ailments.`,
        use(p,e,r){ const h = Math.round((10+8*r + p.maxHp*0.1)*(p.curPower||1)); p.hp = clamp(p.hp+h, 0, p.maxHp); p.status = {};
          return {log:[L(`You down a quick brew: up to ${h} HP restored, ailments cleansed.`)]}; }},
      {id:'grand', name:'Grand Alchemist', type:'passive', max:1, req:5, mods:{itemPower:25, itemSave:10}, desc:'+25% thrown-item damage and +10% item save chance.'},
    ]},
};

/* ---- rarities: cap = max SP you can sink into the tree, power = quality of its skills ---- */
const RARITIES = {
  common:   {name:'Common',    cap:5,  power:1.0,  color:'#a8a29a', weight:52, priceMult:1},
  uncommon: {name:'Uncommon',  cap:7,  power:1.12, color:'#7fbf6a', weight:28, priceMult:1.6},
  rare:     {name:'Rare',      cap:9,  power:1.25, color:'#5fa8e0', weight:13, priceMult:2.5},
  epic:     {name:'Epic',      cap:11, power:1.4,  color:'#b57be0', weight:6,  priceMult:4},
  legendary:{name:'Legendary', cap:11, power:1.6,  color:'#f0b84a', weight:1,  priceMult:7},
};
const RARITY_ORDER = ['common','uncommon','rare','epic','legendary'];
function rollRarity(bonus){
  // bonus shifts weight from common toward higher tiers (used for boss drops)
  bonus = bonus || 0;
  const w = RARITY_ORDER.map((k,i) => RARITIES[k].weight * (i === 0 ? Math.max(0.15, 1 - 0.35*bonus) : 1 + bonus*i*0.9));
  let r = Math.random()*w.reduce((a,b)=>a+b, 0);
  for(let i=0;i<w.length;i++){ r -= w[i]; if(r <= 0) return RARITY_ORDER[i]; }
  return 'common';
}
function rarityOf(p,key){ return (p.rarity && p.rarity[key]) || 'common'; }
function rarityCap(p,key){ return RARITIES[rarityOf(p,key)].cap; }
function rarityBadge(r){ return `<span class="rar" style="color:${RARITIES[r].color};border-color:${RARITIES[r].color}">${RARITIES[r].name}</span>`; }

/* ---- derived stats from the equipped trees ---- */
function mods(p){
  const m = {hp:0,mp:0,atk:0,def:0,mpRegen:0,evade:0,crit:0,potion:0,lifesteal:0,dmgReduce:0,spell:0,burnHit:0,poisonHit:0,stunHit:0,dotPower:0,regen:0,secondWind:0,itemPower:0,itemSave:0,counter:0,bossDmg:0};
  for(const key of p.slots){
    if(!key) continue;
    const ranks = p.ranks[key] || {};
    const pw = RARITIES[rarityOf(p,key)].power;
    for(const n of TREES[key].nodes){
      const r = ranks[n.id] || 0;
      if(r && n.type === 'passive') for(const k in n.mods) m[k] += n.mods[k]*r*(k === 'secondWind' ? 1 : pw);
    }
  }
  for(const slot of ['ring','amulet']){
    const it = p[slot]; if(!it || !JEWELS[it.id]) continue;
    const pw = RARITIES[it.rar].power;
    for(const k in JEWELS[it.id].mods) m[k] += JEWELS[it.id].mods[k]*(k === 'secondWind' ? 1 : pw);
  }
  const dn = p.dun || {}; m.atk += (dn.atk || 0); m.def += (dn.def || 0);
  const ms = p.mastery || {};
  m.atk += (ms.might || 0); m.def += (ms.guard || 0); m.hp += 3*(ms.vigor || 0); m.mp += 2*(ms.focus || 0);
  for(const k in m) m[k] = Math.round(m[k]);
  return m;
}
function nodeRank(p,key,id){ return (p.ranks[key] && p.ranks[key][id]) || 0; }
function costLabel(n){ return n.hpCost ? n.hpCost + '% HP' : n.cost + ' MP'; }
function treeSpent(p,key){ return Object.values(p.ranks[key] || {}).reduce((a,b)=>a+b, 0); }
function heroTitle(p){ const n = p.slots.filter(Boolean).map(k => TREES[k].name); return (n.length ? n.join(' / ') : 'Unaligned') + (p.mode === 'hardcore' ? ' (Hardcore)' : ''); }
function recalcStats(p){
  const m = mods(p);
  const nh = p.base.hp + m.hp, nm = p.base.mp + m.mp;
  p.hp = clamp(p.hp + (nh - p.maxHp), 1, nh);
  p.mp = clamp(p.mp + (nm - p.maxMp), 0, nm);
  p.maxHp = nh; p.maxMp = nm;
  const w = equipped(p,'weapon'), a = equipped(p,'armor');
  p.atk = p.base.atk + m.atk + (w ? w.bonus : 0); p.def = p.base.def + m.def + (a ? a.bonus : 0);
}
function activeSkills(p){
  const out = [];
  for(const key of p.slots){
    if(!key) continue;
    for(const n of TREES[key].nodes){
      if(n.type !== 'active') continue;
      const r = nodeRank(p,key,n.id);
      if(r > 0) out.push({key:`${key}:${n.id}`, tree:key, node:n, rank:r});
    }
  }
  return out;
}
function canSpend(p,key,node){
  return p.sp > 0 && p.slots.includes(key) && treeSpent(p,key) < rarityCap(p,key) && nodeRank(p,key,node.id) < node.max && treeSpent(p,key) >= node.req;
}
function spendSp(key,id){
  const p = S.player, node = TREES[key].nodes.find(n => n.id === id);
  if(!node || !canSpend(p,key,node)) return;
  p.ranks[key] = p.ranks[key] || {};
  p.ranks[key][id] = nodeRank(p,key,id) + 1;
  p.sp -= 1;
  recalcStats(p);
  render();
}
const MOD_LABELS = {mpRegen:['MP/turn',''], evade:['Evade','%'], crit:['Crit','%'], potion:['Potion power','%'], lifesteal:['Lifesteal','%'],
  dmgReduce:['Damage reduction','%'], spell:['Skill damage','%'], burnHit:['Burn on hit','%'], poisonHit:['Poison on hit','%'],
  stunHit:['Stun on hit','%'], dotPower:['DoT power','%'], regen:['HP regen','/turn'],
  bossDmg:['Boss damage','%'], itemPower:['Item power','%'], itemSave:['Item save','%'], counter:['Counter','%']};
function modsSummary(p){
  const m = mods(p);
  const parts = [`ATK ${p.atk}`, `DEF ${p.def}`, `HP ${p.maxHp}`, `MP ${p.maxMp}`];
  for(const k in MOD_LABELS) if(m[k]) parts.push(`${MOD_LABELS[k][0]} +${m[k]}${MOD_LABELS[k][1]}`);
  if(m.secondWind) parts.push('Second Wind');
  return parts.join(' &middot; ');
}

/* ---- dealing damage: crits, skill power, lifesteal and on-hit effects all live here ---- */
function dealDamage(p, e, raw, opts){
  opts = opts || {};
  const m = mods(p);
  let dmg = Math.max(1, Math.round(raw));
  if(opts.skill) dmg = Math.max(1, Math.round(dmg * (1 + m.spell/100) * (p.curPower || 1)));
  if(p.buffs && p.buffs.atk > 0) dmg = Math.round(dmg * 1.4);
  if(e.vuln) dmg = Math.round(dmg * (1 + e.vuln.pct/100));
  if(e.isBoss && m.bossDmg) dmg = Math.round(dmg * (1 + m.bossDmg/100));
  const el = elemMult(e, opts.elem || p.curElem);
  if(el.mult !== 1){ dmg = Math.max(1, Math.round(dmg * el.mult)); if(!e.noted){ e.noted = true; pushLog(el.mult > 1 ? `${e.name} is weak to ${el.elem}!` : `${e.name} resists ${el.elem}.`, el.mult > 1 ? 'good' : 'info'); } }
  let crit = false;
  const chance = (opts.critChance || 0) + m.crit;
  if(p.critNext){ crit = true; p.critNext = false; }
  else if(chance > 0 && rnd(100) < chance) crit = true;
  if(crit) dmg *= 2;
  e.hp = clamp(e.hp - dmg, 0, e.maxHp);
  fx('enemy', '-' + dmg + (crit ? '!' : ''), 'dmg');
  if(m.lifesteal > 0) p.hp = clamp(p.hp + Math.max(1, Math.round(dmg*m.lifesteal/100)), 0, p.maxHp);
  if(e.hp > 0){
    if(m.burnHit && rnd(100) < m.burnHit) applyEnemyDot(e,'burn',p);
    if(m.poisonHit && rnd(100) < m.poisonHit) applyEnemyDot(e,'poison',p);
    if(m.stunHit && !e.stun && rnd(100) < m.stunHit && !(e.isBoss && rnd(100) < 50)){ e.stun = true; pushLog(`${e.name} is stunned!`, 'good'); }
  }
  return {dmg, crit};
}
const DOT_START = {burn:'is set ablaze', poison:'is poisoned', bleed:'starts bleeding'};
function applyEnemyDot(e, kind, p, opt){
  opt = opt || {};
  const m = mods(p);
  const base = kind === 'burn' ? 3 + p.level : 3 + p.level;
  const elemOf = kind === 'burn' ? 'fire' : kind === 'poison' ? 'poison' : null;
  const dmg = Math.max(1, Math.round(base * (opt.mult || 1) * (1 + m.dotPower/100) * elemMult(e, elemOf).mult));
  const fresh = !e.dots[kind];
  e.dots[kind] = {turns: opt.turns || 3, dmg};
  if(fresh) pushLog(`${e.name} ${DOT_START[kind]}.`, 'good');
}

/* ---- getting trees: boss tomes, quests, the Silent Archive ---- */
const BOSS_TOMES = {10:'bulwark', 20:'warblade', 30:'ember', 40:'storm', 50:'duelist', 60:'hex'};
function acquireTree(key, rarity){
  const p = S.player;
  if(!TREES[key] || p.owned.includes(key)) return false;
  rarity = rarity || 'common';
  p.owned.push(key);
  p.rarity[key] = rarity;
  const nm = `${RARITIES[rarity].name} ${TREES[key].name}`;
  const idx = p.slots.indexOf(null);
  if(idx >= 0){
    p.slots[idx] = key;
    recalcStats(p);
    S.notes.push(`${nm} placed in slot ${idx+1}. Open Skill Trees to spend your points.`);
  } else {
    S.notes.push(`${nm} is yours, but all three slots are full. Swap it in at the Guild's Training Hall.`);
  }
  return true;
}
function randomUnownedTree(){
  const pool = Object.keys(TREES).filter(k => !S.player.owned.includes(k));
  return pool.length ? pool[rnd(pool.length)] : null;
}
function dropBossTome(){
  const p = S.player;
  if(p.bossTomes[S.depth]) return;
  p.bossTomes[S.depth] = true;
  let key = BOSS_TOMES[S.depth];
  if(!key || p.owned.includes(key)) key = randomUnownedTree();
  if(key){
    const r = rollRarity(Math.min(S.depth/10, 4));
    S.notes.push(`${S.enemy.name} drops a ${RARITIES[r].name} skill tome: ${TREES[key].name}!`);
    acquireTree(key, r);
  }
}
function shopStock(){
  const p = S.player;
  p.stock = p.stock || {};
  for(const k of Object.keys(p.stock)) if(p.owned.includes(k)) delete p.stock[k];
  for(const k of Object.keys(TREES)) if(!TREES[k].exclusive && !p.owned.includes(k) && !p.stock[k]) p.stock[k] = rollRarity(0);
  return p.stock;
}
function upgradeStock(){
  const p = S.player; p.stockUp = p.stockUp || {};
  const bonus = Math.min(3, ((S.stats && S.stats.deepestFloor) || 1)/30);
  for(const k of p.owned) if(TREES[k] && p.stockUp[k] === undefined) p.stockUp[k] = rollRarity(bonus);
  return p.stockUp;
}
function upgradeOffers(){
  const p = S.player, st = upgradeStock();
  return p.owned.filter(k => TREES[k] && RARITY_ORDER.indexOf(st[k]) > RARITY_ORDER.indexOf(rarityOf(p,k)));
}
function upgradePrice(k, r){ return Math.max(10, tomePrice(k, r) - Math.round(tomePrice(k, rarityOf(S.player,k))*0.5)); }
function buyUpgrade(k){
  const p = S.player, r = upgradeStock()[k];
  if(!TREES[k] || !p.owned.includes(k) || RARITY_ORDER.indexOf(r) <= RARITY_ORDER.indexOf(rarityOf(p,k))) return;
  const price = upgradePrice(k, r); if(p.gold < price) return;
  p.gold -= price; p.rarity[k] = r; recalcStats(p); delete p.stockUp[k];
  S.notes = [`${TREES[k].name} is reforged as a ${RARITIES[r].name} tome. You can spend more points in it now.`];
  render();
}
function tomePrice(key, rarity){ return Math.round(TREES[key].price * RARITIES[rarity].priceMult); }
function buyTree(key){
  const p = S.player, r = shopStock()[key];
  if(!TREES[key] || p.owned.includes(key) || !r) return;
  const price = tomePrice(key, r);
  if(p.gold < price) return;
  p.gold -= price;
  S.notes = [];
  acquireTree(key, r);
  delete p.stock[key];
  render();
}
function retrainCost(){ return 30 + 10*S.player.level; }
function openRetrain(i){ S.retrainSlot = i; S.screen = 'retrainPick'; render(); }
function retrain(slot, newKey){
  const p = S.player, cost = retrainCost();
  const oldKey = p.slots[slot];
  if(p.gold < cost || !oldKey) return;
  if(newKey !== oldKey && (!p.owned.includes(newKey) || p.slots.includes(newKey))) return;
  p.gold -= cost;
  const refund = treeSpent(p, oldKey);
  p.sp += refund;
  p.ranks[oldKey] = {};
  p.slots[slot] = newKey;
  recalcStats(p);
  S.notes = [`${refund} skill point${refund===1 ? '' : 's'} refunded.`];
  S.screen = 'training';
  render();
}
function treeFull(p,key){ return treeSpent(p,key) >= rarityCap(p,key) || TREES[key].nodes.every(n => nodeRank(p,key,n.id) >= n.max); }
function masteryOpen(p){ const eq = p.slots.filter(Boolean); return eq.length > 0 && eq.every(k => treeFull(p,k)); }
const MASTERY = {might:['Might','+1 ATK'], guard:['Guard','+1 DEF'], vigor:['Vigor','+3 max HP'], focus:['Focus','+2 max MP']};
function spendMastery(k){
  const p = S.player;
  if(!MASTERY[k] || p.sp <= 0 || !masteryOpen(p)) return;
  p.mastery = p.mastery || {might:0,guard:0,vigor:0,focus:0};
  p.mastery[k] += 1; p.sp -= 1;
  recalcStats(p); render();
}
function openTrees(){ S.treesReturn = S.screen; S.screen = 'trees'; render(); }
function autoSpend(){ const p = S.player; for(let g = 0; g < 6 && p.sp > 0; g++){ const key = p.slots[0], n = TREES[key].nodes.find(n => canSpend(p,key,n)); if(!n) break; spendSp(key, n.id); } }
function closeTrees(){ S.screen = S.treesReturn || 'town'; render(); }

  if(o.backspikes) s += spikes(Array.from({length:o.backspikes},(_,i)=>[bx-18+i*(36/(o.backspikes-1||1)), by-ry+2, 3,-11-(i%2)*3,3]), o.spikeC||acc);
  if(o.mane) s += `<g class="sway">` + spikes([[34,46,-10,-12,5],[42,40,-6,-14,5],[50,40,-2,-14,5],[58,42,4,-14,5],[66,44,10,-10,5]], o.maneC||acc) + `</g>`;
  if(o.wisps) s += `<g class="wisp">` + [0,1,2,3].map(i=>`<path d="M${bx-20+i*14} ${by+ry-2} q-4 8 0 14 q4 -6 0 -14" fill="${acc}" opacity="0.6"/>`).join('') + `</g>`;
  // near legs
  s += `<rect x="${bx-24}" y="${by+4}" width="8" height="${28-sz*2}" rx="2.5" fill="${main}" ${OL}/><rect x="${bx+8}" y="${by+4}" width="8" height="${28-sz*2}" rx="2.5" fill="${main}" ${OL}/>`;
  s += `<rect x="${bx-25}" y="${by+28-sz*2}" width="10" height="4" rx="1.5" fill="${dark}"/><rect x="${bx+7}" y="${by+28-sz*2}" width="10" height="4" rx="1.5" fill="${dark}"/>`;
  // head
  const hx=26, hy=52, hr=13*(o.headSize||1);

  if(o.skull){
    s += `<ellipse cx="${hx}" cy="${hy}" rx="${hr}" ry="${hr*0.9}" fill="${light}" ${OL}/><path d="M${hx-12} ${hy+3} h-8 q-2 5 2 8 h10z" fill="${light}" ${OL}/>`;
    s += `<ellipse cx="${hx-1}" cy="${hy-3}" rx="3.4" ry="4" fill="#0d0907"/>` + eye(hx-1,hy-3,1.6,ec) + `<path d="M${hx-18} ${hy+9} h8 M${hx-16} ${hy+7} v4 M${hx-13} ${hy+7} v4" stroke="#0d0907" stroke-width="1"/>`;
  } else {
    s += `<ellipse cx="${hx}" cy="${hy}" rx="${hr}" ry="${hr*0.92}" fill="${f}" ${OL}/>`;
    const sn = o.snout||'short';
    const sl = sn==='long' ? 16 : 10;
    s += `<path d="M${hx-9} ${hy-1} L${hx-9-sl} ${hy+4} Q${hx-9-sl} ${hy+10} ${hx-8} ${hy+9} Z" fill="${o.muzzle||main}" ${OL}/>`;
    s += `<circle cx="${hx-9-sl+1}" cy="${hy+3}" r="2.4" fill="#120c08"/>`;
    if(o.fangs!==false) s += `<path d="M${hx-9-sl+4} ${hy+8} l2 5 l2 -5z M${hx-12} ${hy+8} l2 5 l2 -5z" fill="#f4ecd8"/>`;

    else if(ears==='long') s += `<path d="M${hx+3} ${hy-10} Q${hx+6} ${hy-30} ${hx+12} ${hy-12}Z M${hx-7} ${hy-10} Q${hx-6} ${hy-30} ${hx} ${hy-11}Z" fill="${dark}" ${OL}/>`;
    if(o.horns) s += `<path d="M${hx-4} ${hy-10} Q${hx-12} ${hy-24} ${hx-2} ${hy-28} M${hx+6} ${hy-10} Q${hx+14} ${hy-24} ${hx+4} ${hy-28}" stroke="${o.hornC||light}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;

  return wrap(`<g class="bob">${s}</g>`);
}

/* ---------- HUMANOID (front) ---------- */

  else if(w==='bigaxe') s += `<rect x="${wx-2}" y="${wy-38}" width="4" height="50" fill="#5a3c25" ${OL}/><path d="M${wx} ${wy-38} q22 -4 18 18 q-10 6 -18 -4z M${wx} ${wy-38} q-14 -2 -12 10 q6 4 12 -2z" fill="#aeb4be" ${OL}/>`;

  else if(w==='trident') s += `<rect x="${wx-1.4}" y="${wy-42}" width="2.8" height="56" fill="#3d7f80" ${OL}/><path d="M${wx-7} ${wy-42} v-12 l3 6 l4 -10 l4 10 l3 -6 v12 q-7 5 -14 0z" fill="#58c0c4" ${OL}/>`;

  s += `</g>`;
  // head
  const hy = top-hr+4;
  s += `<g class="head">`;
  const hd = o.head||[];
  if(hd.includes('hood')) s += `<path d="M${50-hr-3} ${hy+hr+4} Q${50-hr-4} ${hy-hr-4} 50 ${hy-hr-6} Q${50+hr+4} ${hy-hr-4} ${50+hr+3} ${hy+hr+4}Z" fill="${o.hoodC||dark}" ${OL}/><ellipse cx="50" cy="${hy+3}" rx="${hr-3}" ry="${hr-2}" fill="#0c0806"/>`;

  if(hd.includes('bandana')) s += `<path d="M${50-hr} ${hy-4} Q50 ${hy-9} ${50+hr} ${hy-4} v4 Q50 ${hy-3} ${50-hr} ${hy}Z" fill="${acc}" ${OL}/>`;

  if(hd.includes('frost')) s += spikes([[44,hy-hr+3,-3,-12,3],[50,hy-hr+1,0,-15,3],[56,hy-hr+3,3,-12,3]],'#e8fbff');
  if(hd.includes('flowers')) s += `<circle cx="${50-hr+3}" cy="${hy-hr+4}" r="3" fill="#ff7aa8"/><circle cx="${50+hr-4}" cy="${hy-hr+3}" r="2.6" fill="#ffd56a"/><circle cx="50" cy="${hy-hr}" r="2.4" fill="#ff7aa8"/>`;
  s += `</g>`;
  if(o.shield) s += `<g class="armL"><path d="M${50-bw-16} ${top+6} h18 v14 q0 10 -9 14 q-9 -4 -9 -14z" fill="${o.shield}" ${OL}/><path d="M${50-bw-7} ${top+9} v22" stroke="${acc}" stroke-width="2"/><circle cx="${50-bw-7}" cy="${top+17}" r="3" fill="${acc}"/></g>`;
  if(o.extra) s += o.extra;
  return wrap(`<g class="bob">${s}</g>`);
}

function serpent(P,o={}){

  s += eye(44,33,3,ec)+eye(56,33,3,ec) + `<path d="M43 42 q7 6 14 0 M45 43 v3 M50 45 v3 M55 43 v3" stroke="#f4ecd8" stroke-width="1.4" fill="none"/>`;
  const dec = o.deco||[];
  if(dec.includes('trident')) s += `<g class="armR"><rect x="76" y="40" width="2.6" height="50" fill="#4a3a2c"/><path d="M71 40 v-10 l3 5 l3.6 -9 l3.6 9 l3 -5 v10z" fill="#c9ccd1" ${OL}/></g>`;
  if(dec.includes('flame')) s += `<g class="flick"><path d="M78 56 q-6 -10 2 -16 q0 8 6 8 q4 4 -2 8z" fill="${acc}"/></g>`;
  if(dec.includes('crystal')) s += `<polygon points="34,56 28,44 40,50" fill="${light}" opacity="0.85" ${S1}/><polygon points="66,56 72,44 60,50" fill="${light}" opacity="0.85" ${S1}/><polygon points="50,80 44,92 56,92" fill="${light}" opacity="0.7" ${S1}/>`;
  if(dec.includes('rift')) s += `<path class="glowline" d="M50 44 l-4 10 l6 6 l-5 10" stroke="${acc}" stroke-width="2.4" fill="none"/>`;
  if(dec.includes('eyes')) s += `<circle cx="42" cy="58" r="2.6" fill="${ec}"/><circle cx="58" cy="58" r="2.6" fill="${ec}"/><circle cx="50" cy="68" r="2.6" fill="${ec}"/><circle cx="50" cy="20" r="2.4" fill="${ec}"/>`;

  return wrap(s+`</g>`);
}

function sprPortrait(key){ const sp = SPRITES[key]; return sp ? `<div class="spr-port spr-port-${sp.sheet}" style="--tint:${sp.tint || ' '}" role="img" aria-label="${sp.label} portrait"></div>` : ''; }
function enemyArt(key, d, rare){
  if(SPRITES[key]){
    const sp = SPRITES[key], tint = ((sp.tint || '') + (rare ? ' sepia(0.35) saturate(1.8) drop-shadow(0 0 8px #f0b84a)' : '')).trim() || ' ';
    return `<div class="art spr spr-${sp.sheet}" style="--tint:${tint}" role="img" aria-label="${sp.label}"></div>`;
  }
  const base = ENEMY_BASE[key]; let a = ART2[key] || svg[base.art];
  const f = rare ? 'sepia(0.35) saturate(1.8) drop-shadow(0 0 8px #f0b84a)' : '';
  return f ? a.replace('<svg ', `<svg style="filter:${f}" `) : a;
}
function stageGlow(key, d){ return BOSS_GLOW[key] || ZONE_GLOW[zoneIdx(d)]; }

function zoneArt(key, d, rare){ let f = ZONE_FILTERS[zoneIdx(d)]; if(rare) f = (f === 'none' ? '' : f + ' ') + 'sepia(0.6) saturate(2) drop-shadow(0 0 8px #f0b84a)'; return f === 'none' ? svg[key] : svg[key].replace('<svg ', `<svg style="filter:${f}" `); }

function tierFor(depth){
  return TIERS.find(t => depth >= t.range[0] && depth <= t.range[1]) || TIERS[TIERS.length-1];

const ENEMY_ZONE = {};
TIERS.forEach((t,i) => t.enemies.forEach(k => { ENEMY_ZONE[k] = i; }));
Object.entries(BOSS_FLOORS).forEach(([f,k]) => { ENEMY_ZONE[k] = Math.floor((f-1)/10); });
const ART_TRAITS = [
  {arts:['skeleton','wraith','boneknight','wraithknight','ashwraith','banditghost'], weak:['fire'], resist:['poison']},
  {arts:['golem','beetle'], weak:['lightning'], resist:['poison','cold']},
  {arts:['hound','drake','imp','moltenslime'], weak:['cold'], resist:['fire']},
];
const ZONE_TRAITS = {3:{weak:['fire'],resist:['cold']}, 4:{weak:['lightning'],resist:['fire']}, 5:{weak:['fire'],resist:['poison']},
  6:{weak:['cold'],resist:['lightning']}, 7:{weak:['poison'],resist:['lightning']}, 8:{weak:['lightning'],resist:['poison']}, 9:{weak:['cold'],resist:['fire']}};
function enemyTraits(key){
  if(key === 'bell') return {weak:[], resist:[]};
  const art = ENEMY_BASE[key] && ENEMY_BASE[key].art;
  const g = ART_TRAITS.find(x => x.arts.includes(art));
  if(g) return {weak:g.weak, resist:g.resist};
  return ZONE_TRAITS[ENEMY_ZONE[key]] || {weak:[], resist:[]};
}
function elemMult(e, elem){
  if(!elem) return {mult:1};
  const t = enemyTraits(e.key), soft = e.isBoss;
  if(t.weak.includes(elem)) return {mult: soft ? 1.15 : 1.35, elem};
  if(t.resist.includes(elem)) return {mult: soft ? 0.85 : 0.7, elem};
  return {mult:1};
}
function traitHint(key){
  const t = enemyTraits(key), parts = [];
  if(t.weak.length) parts.push('Weak: ' + t.weak.join(', '));
  if(t.resist.length) parts.push('Resists: ' + t.resist.join(', '));
  return parts.join(' · ');
}

function generateRoomForDepth(depth){
  if(CAMPS[depth]) return {t:'camp'};
  if(BOSS_FLOORS[depth]) return {t:'boss', key: BOSS_FLOORS[depth]};
  const tier = tierFor(depth);
  const events = ['treasure','treasure','shrine','merchant','trap','trap','doors','doors','altar','healer','journal'].concat(depth >= 5 ? ['riddle'] : []).concat(depth >= 10 ? ['blackmarket'] : []);
  const type = rnd(100) < 62 ? 'monster' : events[rnd(events.length)];
  if(type === 'treasure') return {t:'treasure', mimic: depth >= 3 && rnd(100) < 15};
  if(type === 'monster'){ const thief = rnd(100) < 5; return {t:'monster', key: tier.enemies[rnd(tier.enemies.length)], rare: !thief && rnd(100) < 8, thief}; }
  return {t:type};
}

  const jw = JEWELS[it.id], pw = RARITIES[it.rar].power, parts = [];

  const p = S.player, it = ITEMS[id];
  if(!it || it.passive || itemCount(id) <= 0) return;
  if(it.unusable && it.unusable(p, S.enemy)) return;
  const saved = mods(p).itemSave > 0 && rnd(100) < mods(p).itemSave;
  if(!saved){ p.items[id] -= 1; if(p.items[id] <= 0) delete p.items[id]; }

  S.itemMenu = false;
  const before = p.hp;
  const result = it.use(p, S.enemy);
  (result.log||[]).forEach(l => pushLog(l.msg, l.cls));
  if(p.hp > before) fx('player', '+'+(p.hp-before), 'heal');

const RANK_BANDS = [[90,'S'],[80,'A'],[70,'B'],[60,'C'],[50,'D'],[40,'E'],[30,'F'],[20,'G'],[10,'H'],[0,'I']];
function rankLetter(score){
  for(const [min,letter] of RANK_BANDS){ if(score >= min) return letter; }
  return 'I';
}
function computeStatus(p){
  const m = mods(p);
  return [
    { label:'Strength',   rank: rankLetter(clamp(p.atk*3, 0, 99)) },
    { label:'Endurance',  rank: rankLetter(clamp(p.def*3 + m.dmgReduce, 0, 99)) },
    { label:'Dexterity',  rank: rankLetter(clamp(p.level*8 + m.crit*2, 0, 99)) },
    { label:'Agility',    rank: rankLetter(clamp(p.level*7 + m.evade*3, 0, 99)) },
    { label:'Magic',      rank: rankLetter(clamp(p.maxMp*3, 0, 99)) },
  ];
}

function rnd(n){ return Math.floor(Math.random()*n); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

/* ---------- State ---------- */
function freshState(){
  return {
    screen:'title',
    depth:1,
    mode:'descend',
    currentRoom:null,
    player:null,
    enemy:null,
    log:[],
    fleeUsed:false,
    lastReward:null,
    merchantBought:{}, merchantStock:null, itemMenu:false,
    stats:{monstersDefeated:0, deepestFloor:1, bossesDefeated:0, itemsUsed:0, rareDefeated:0, treasures:0},
    questsClaimed:{},
    unlockedStarts:[1],
    notes:[],
    fx:[],
    inDungeon:false, eventRes:null, doorOutcomes:null, bmStock:null,
    treesReturn:null,
    retrainSlot:0,
  };
}
let S = freshState();

function pushLog(msg, cls){ S.log.push({msg, cls}); if(S.log.length > 40) S.log.shift(); }

function makePlayer(treeKey, rarity, mode){

    guardActive:false, status:{}, dodgeNext:false, critNext:false, secondWindUsed:false,

/* ---------- Save / load ---------- */
const SAVE_KEY = 'emberdeep-save-v5';
const TOWN_SCREENS = ['town','tavern','smith','merchantTown','guild','guildStatus','guildQuests','descendSelect','trees','archive','training','retrainPick'];
function saveGame(){
  try{
    if(!S.player || S.inDungeon) return;
    const player = Object.assign({}, S.player, {status:{}, guardActive:false, dodgeNext:false, critNext:false, secondWindUsed:false});
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:5, player, stats:S.stats, questsClaimed:S.questsClaimed, unlockedStarts:S.unlockedStarts}));
  }catch(e){}
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.v !== 5 || !d.player || !d.stats || !d.player.base || !Array.isArray(d.player.slots) || !Array.isArray(d.player.owned) || !d.player.rarity || !d.player.items || !('weapon' in d.player)) return null;
    if(!d.player.slots.every(k => k === null || TREES[k]) || !d.player.owned.every(k => TREES[k])) return null;
    return d;
  }catch(e){ return null; }
}
function deleteSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function continueGame(){
  const d = loadSave();
  if(!d) return;
  S = freshState();
  S.player = d.player;
  S.player.status = {}; S.player.guardActive = false; S.player.dodgeNext = false; S.player.critNext = false; S.player.curPower = 1; S.player.stock = {}; S.player.stockUp = {}; S.player.buffs = {}; S.player.dun = {atk:0,def:0,taken:0};
  S.stats = Object.assign(freshState().stats, d.stats);
  S.player.trophies = S.player.trophies || {}; S.player.parry = 0; S.player.jewels = S.player.jewels || []; S.player.mode = S.player.mode || 'standard'; S.player.dun = {atk:0,def:0,taken:0}; S.player.mastery = S.player.mastery || {might:0,guard:0,vigor:0,focus:0};
  S.questsClaimed = d.questsClaimed || {};
  S.unlockedStarts = (d.unlockedStarts && d.unlockedStarts.length) ? d.unlockedStarts : [1];
  S.screen = 'town';
  render();
}

function notesHtml(){
  return (S.notes && S.notes.length)
    ? `<div style="margin-top:10px;font-size:0.9em;color:var(--ember-bright);text-align:center;">${S.notes.join('<br>')}</div>`
    : '';
}
function fx(target, text, kind){ S.fx.push({target, text, kind}); }
function unlockStart(d){
  if(d > MAX_FLOOR || S.unlockedStarts.includes(d)) return;
  S.unlockedStarts.push(d);
  S.unlockedStarts.sort((a,b)=>a-b);
  S.notes.push(`Checkpoint unlocked: you can now begin descents from floor ${d}.`);
}

/* ---------- Battle logic ---------- */
const ENEMY_SPECIALS = {
  spider:{poison:35}, toad:{poison:40}, ant:{poison:15},
  bat:{drain:40}, wraith:{drain:30}, ashwraith:{drain:30, burn:20}, banditghost:{drain:25},
  orc:{smash:25}, golem:{smash:30}, beetle:{smash:20}, boneknight:{smash:30}, warchief:{smash:30},
  hound:{burn:30}, drake:{burn:35}, imp:{burn:30}, moltenslime:{burn:30}, warden:{burn:45, smash:25},
};
DEEP_TIERS.forEach(t => t.mon.forEach(m => { if(m[4]) ENEMY_SPECIALS[m[0]] = m[4]; }));
Object.values(DEEP_BOSSES).forEach(b => { ENEMY_SPECIALS[b[0]] = b[3]; });
const SPECIAL_HINT = { poison:'Venomous', drain:'Drains life', smash:'Heavy hitter', burn:'Wreathed in flame' };

function startBattle(enemyKey, isBoss, rare, thief){ S.itemMenu = false; bestiaryNote(enemyKey, 'seen');
  const base = ENEMY_BASE[enemyKey];
  const variance = 1 + (rnd(10)-4)/100;
  let hpS = 1, atkS = 1, rewS = 1;
  if(!isBoss){
    // monsters get tougher the deeper you go within their tier
    const within = Math.max(0, S.depth - tierFor(S.depth).range[0]);
    hpS = 1 + 0.06*within; atkS = 1 + 0.035*within; rewS = 1 + 0.05*within;
    hpS *= 1 + 0.018*Math.min(S.depth,30); atkS *= 1 + 0.016*Math.min(S.depth,30);
  }
  if(S.player.mode === 'hardcore'){ hpS *= 1.2; atkS *= 1.2; rewS *= 1.5; }
  const hp = Math.round(base.hp*variance*hpS);
  S.enemy = {
    key:enemyKey, name:base.name, art:base.art, isBoss:!!isBoss,
    hp, maxHp:hp,
    atk: Math.round(base.atk*atkS), def: base.def,
    xp: Math.round(base.xp*rewS), gold: Math.round(base.gold*rewS),
    stun:false, dots:{},
  };
  if(rare && !isBoss){
    const e = S.enemy;
    e.rare = true; e.name = RARE_PREFIX[zoneIdx(S.depth)] + ' ' + e.name;
    e.hp = e.maxHp = Math.round(e.hp*2.4); e.atk = Math.round(e.atk*1.35); e.def += 2; e.xp *= 4; e.gold *= 4;
  }
  if(thief && !isBoss && !rare){
    const e = S.enemy;
    e.thief = true; e.thiefTurns = 0; e.name = 'Thieving ' + e.name;
    e.hp = e.maxHp = Math.round(e.hp*0.9); e.atk = Math.max(1, Math.round(e.atk*0.6)); e.gold *= 6;
  }
  S.fleeUsed = false;
  cleanupBattle();
  S.log = [];
  pushLog(`${S.enemy.name} blocks your path.`, 'info');
  if(S.enemy.thief) pushLog('It clutches a sack of loot and eyes the exit. Kill it fast!', 'info');
  S.screen = 'battle';
  render();
}

function cleanupBattle(){
  const p = S.player;
  p.status = {}; p.dodgeNext = false; p.critNext = false; p.guardActive = false; p.secondWindUsed = false; p.buffs = {}; p.parry = 0;
}

const MODES = {
  casual:{name:'Adventurer', desc:'Forgiving: if you fall, you wake in town and lose half your gold.'},
  standard:{name:'Delver', desc:'Classic: death is permanent and erases your save.'},
  hardcore:{name:'Hardcore', desc:'Brutal: permadeath, foes 20% stronger, +50% XP and gold.'},
};
function die(){
  const p = S.player;
  if(p && p.mode === 'casual'){
    const lost = Math.floor(p.gold/2); p.gold -= lost;
    p.hp = p.maxHp; p.mp = p.maxMp; p.status = {};
    cleanupBattle();
    S.notes = [`You collapse in the dark and wake in town. You lost ${lost} gold.`];
    goToTown();
    return;
  }
  try{ S.lastRun = hallRecord('fell', S.enemy && S.enemy.name ? S.enemy.name : 'the dark'); }catch(e){}
  S.screen = 'gameover'; deleteSave();
}
function checkDeath(){
  const p = S.player;
  if(p.hp > 0) return false;
  if(mods(p).secondWind && !p.secondWindUsed){
    p.secondWindUsed = true;
    p.hp = Math.max(1, Math.round(p.maxHp*0.3));
    pushLog('Second Wind! You refuse to fall.', 'good');
    fx('player', '+'+p.hp, 'heal');
    return false;
  }
  if(p.items && p.items.phoenix > 0){
    p.items.phoenix -= 1; if(p.items.phoenix <= 0) delete p.items.phoenix;
    p.hp = Math.max(1, Math.round(p.maxHp*0.5)); p.status = {};
    pushLog('A Phoenix Feather flares and burns away. You rise again!', 'good'); fx('player', '+'+p.hp, 'heal');
    return false;
  }
  die();
  return true;
}

function statusDamage(kind){ return kind === 'poison' ? 2 + Math.round(S.depth/8) : 3 + Math.round(S.depth/6); }
function applyStatus(kind){
  S.player.status[kind] = {turns:3, dmg:statusDamage(kind)};
  pushLog(kind === 'poison' ? 'You are poisoned!' : 'You catch fire!', 'hit');
}
function tickPlayerStatus(){
  const st = S.player.status;
  for(const kind of ['poison','burn']){
    const s = st[kind];
    if(!s) continue;
    S.player.hp = clamp(S.player.hp - s.dmg, 0, S.player.maxHp);
    pushLog(kind === 'poison' ? `Poison courses through you for ${s.dmg}.` : `Flames sear you for ${s.dmg}.`, 'hit');
    fx('player', '-'+s.dmg, 'hurt');
    s.turns -= 1;
    if(s.turns <= 0){ delete st[kind]; pushLog(kind === 'poison' ? 'The poison runs its course.' : 'The flames die out.', 'info'); }
  }
}
const DOT_VERB = {burn:'burns', poison:'suffers poison damage', bleed:'bleeds'};
function tickEnemyStatus(){
  const e = S.enemy;
  if(e.weak > 0) e.weak -= 1;
  if(e.vuln){ e.vuln.turns -= 1; if(e.vuln.turns <= 0) delete e.vuln; }
  for(const kind of ['burn','poison','bleed']){
    const d = e.dots[kind];
    if(!d) continue;
    e.hp = clamp(e.hp - d.dmg, 0, e.maxHp);
    pushLog(`${e.name} ${DOT_VERB[kind]} for ${d.dmg}.`, 'good');
    fx('enemy', '-'+d.dmg, 'dmg');
    d.turns -= 1;
    if(d.turns <= 0) delete e.dots[kind];
    if(e.hp <= 0) break;
  }
}

function counterStrike(){
  const p = S.player, e = S.enemy, m = mods(p);
  if(m.counter > 0 && e.hp > 0 && rnd(100) < m.counter){
    const r = dealDamage(p, e, p.atk*0.8 + rnd(3) - e.def*0.5, {});
    pushLog(`You counter ${e.name} for ${r.dmg}.`, 'good');
  }
}
function enemyTurn(){
  const e = S.enemy, p = S.player;
  if(e.hp <= 0) return;
  if(e.stun){ e.stun = false; pushLog(`${e.name} is stunned and cannot act.`, 'info'); return; }
  if(e.thief){ e.thiefTurns += 1; if(e.thiefTurns >= 4){ e.fled = true; pushLog(`${e.name} scoops up its loot and bolts into the dark!`, 'hit'); return; } }
  if(e.isBoss && !e.charging){ e.turn = (e.turn || 0) + 1; if(e.turn % 3 === 0){ e.charging = true; pushLog(`${e.name} gathers power for a crushing blow! Guard, stun or dodge it.`, 'hit'); return; } }
  const sp0 = ENEMY_SPECIALS[e.key] || {};
  if(!e.isBoss && !e.charging && (sp0.smash >= 25 || sp0.burn >= 35) && rnd(100) < 22){
    e.charging = true;
    pushLog(sp0.smash >= 25 ? `${e.name} rears back for a crushing blow!` : `${e.name} draws a deep, glowing breath!`, 'hit');
    return;
  }
  const big = !!e.charging; e.charging = false;
  if(p.dodgeNext){ p.dodgeNext = false; pushLog(`${e.name} strikes at empty shadow.`, 'info'); return; }
  if(p.parry){ const pw = p.parry; p.parry = 0; pushLog(`You parry ${e.name}'s attack!`, 'good'); const r = dealDamage(p,e,p.atk*(1.5+0.3*pw)+rnd(4)-e.def*0.3,{skill:true}); pushLog(`Your riposte hits for ${r.dmg}.`, 'good'); return; }
  const m = mods(p);
  if(m.evade > 0 && rnd(100) < m.evade){ pushLog(`You slip out of the way of ${e.name}.`, 'info'); counterStrike(); return; }
  const sp = ENEMY_SPECIALS[e.key] || {};
  let dmg = Math.max(1, Math.round(e.atk + rnd(4) - p.def*0.7));
  let how = 'strikes you';
  if(sp.smash && !big && rnd(100) < sp.smash){ dmg = Math.round(dmg*1.7); how = 'smashes you'; }
  if(big){ dmg = Math.round(dmg*(!e.isBoss ? 1.8 : S.depth <= 30 ? 1.9 : 2.4)); how = 'unleashes a crushing blow on you'; }
  if(m.dmgReduce) dmg = Math.max(1, Math.round(dmg*(1 - m.dmgReduce/100)));
  if(e.weak > 0) dmg = Math.max(1, Math.round(dmg*0.7));
  if(p.dun && p.dun.taken) dmg = Math.max(1, Math.round(dmg*(1 + p.dun.taken/100)));
  if(p.buffs && p.buffs.guard > 0) dmg = Math.max(1, Math.round(dmg/2));
  if(p.guardActive){ dmg = Math.round(dmg/2); p.guardActive = false; pushLog('Your guard softens the blow.', 'info'); }
  p.hp = clamp(p.hp - dmg, 0, p.maxHp);
  pushLog(`${e.name} ${how} for ${dmg}.`, 'hit');
  fx('player', '-'+dmg, 'hurt');
  if(p.hp > 0){
    counterStrike();
    if(sp.drain && rnd(100) < sp.drain){
      const h = Math.max(1, Math.round(dmg/2));
      e.hp = clamp(e.hp + h, 0, e.maxHp);
      pushLog(`${e.name} drains ${h} life from you.`, 'hit');
    }
    if(sp.poison && rnd(100) < sp.poison) applyStatus('poison');
    if(sp.burn && (rnd(100) < sp.burn || (big && sp.burn >= 35))) applyStatus('burn');
  }
}

function regenTurn(){
  const p = S.player, m = mods(p);
  for(const k of Object.keys(p.buffs || {})){ p.buffs[k] -= 1; if(p.buffs[k] <= 0) delete p.buffs[k]; }
  p.mp = clamp(p.mp + 1 + m.mpRegen, 0, p.maxMp);
  if(m.regen > 0 && p.hp > 0){
    const b = p.hp;
    p.hp = clamp(p.hp + m.regen, 0, p.maxHp);
    if(p.hp > b) fx('player', '+'+(p.hp-b), 'heal');
  }
}

// everything that happens after the player spends their turn
function endOfPlayerAction(){
  if(checkVictory()) return;
  enemyTurn();
  if(S.enemy.fled){ S.lastReward = {gold:0, xp:0, fled:true}; S.notes = [`${S.enemy.name} escaped.`]; cleanupBattle(); S.screen = 'reward'; return; }
  if(checkDeath()) return;
  tickPlayerStatus();
  if(checkDeath()) return;
  tickEnemyStatus();
  if(checkVictory()) return;
  regenTurn();
}

function checkVictory(){
  if(S.enemy.hp > 0) return false;
  pushLog(`${S.enemy.name} falls, leaving a magic stone behind.`, 'good');
  try{ const el = document.querySelector('.stage svg.art, .stage .spr'); if(el){ const r = el.getBoundingClientRect(); S.deathFx = {html: el.outerHTML, x:r.left, y:r.top, w:r.width, h:r.height, boss:!!S.enemy.isBoss}; } }catch(err){}
  S.notes = [];
  S.player.gold += S.enemy.gold;
  gainXp(S.enemy.xp);
  S.stats.monstersDefeated += 1;
  S.lastReward = { gold:S.enemy.gold, xp:S.enemy.xp };
  if(rnd(100) < 12){ const id = randomLoot(); addItem(id, 1); S.notes.push(`Loot: ${ITEMS[id].name}.`); }
  if(S.enemy.rare){
    const zi = zoneIdx(S.depth), tid = 'relic' + zi;
    S.player.trophies[tid] = (S.player.trophies[tid] || 0) + 1;
    S.stats.rareDefeated = (S.stats.rareDefeated || 0) + 1;
    S.notes.push(`Rare drop: ${TROPHIES[zi]}!`);
    if(rnd(100) < 35){ const pool = ['elixir','elixir','phoenix','tonic','whetstone','frostbomb']; const id = pool[rnd(pool.length)]; addItem(id, 1); S.notes.push(`Also: ${ITEMS[id].name}.`); }
    if(rnd(100) < 30) addJewel(rollRarity(1.5));
    if(rnd(100) < 8){ const k = randomUnownedTree(); if(k){ const r = rollRarity(3); S.notes.push(`It carried a tome: ${RARITIES[r].name} ${TREES[k].name}!`); acquireTree(k, r); } }
  }
  S.player.fights = (S.player.fights || 0) + 1; bestiaryNote(S.enemy.key, 'kill', S.enemy.rare);
  cleanupBattle();
  if(S.enemy.isBoss){
    S.stats.bossesDefeated += 1; { const _bf=S.depth, _bk=S.enemy.key; setTimeout(()=>bossEnd(_bf,_bk),0); }
    addJewel(rollRarity(Math.min(S.depth/10, 4)*0.8 + 0.5));
    dropBossTome();
    const hasNextFloor = S.depth < MAX_FLOOR;
    if(hasNextFloor) unlockStart(S.depth + 1);
    S.screen = hasNextFloor ? 'floorClear' : 'victory';
  } else {
    S.screen = 'reward';
  }
  return true;
}

function gainXp(amount){
  S.player.xp += amount;
  while(S.player.xp >= S.player.xpNext){
    S.player.xp -= S.player.xpNext;
    levelUpStats();
    pushLog(`You have reached level ${S.player.level}.`, 'good');
  }
}

function levelUpStats(){
  const p = S.player;
  p.level += 1;
  p.base.hp += 5; p.base.mp += 2; p.base.atk += (p.level % 2 === 0 ? 2 : 1); p.base.def += 1;
  const gain = p.level <= 16 ? 2 : 1;
  p.sp += gain;
  p.xpNext = 30 * p.level;
  recalcStats(p);
  p.hp = p.maxHp;
  p.mp = p.maxMp;
  S.notes.push(`Level ${p.level} reached! +${gain} skill point${gain===1?'':'s'}.`);
}

function playerAttack(){
  const p = S.player, before = p.hp;
  const res = dealDamage(p, S.enemy, p.atk + rnd(4) - S.enemy.def, {});
  pushLog(res.crit ? `You land a critical strike for ${res.dmg}!` : `You strike for ${res.dmg}.`, 'good');
  if(p.hp > before) fx('player', '+'+(p.hp-before), 'heal');
  endOfPlayerAction();
  render();
}

function findSkill(key){
  const [tree, id] = key.split(':');
  const node = TREES[tree] && TREES[tree].nodes.find(n => n.id === id);
  const rank = node ? nodeRank(S.player, tree, id) : 0;
  return rank > 0 && S.player.slots.includes(tree) ? {node, rank, tree} : null;
}

function playerSkill(skillKey){
  const found = findSkill(skillKey);
  if(!found) return;
  const {node, rank, tree} = found, p = S.player;
  if(p.mp < node.cost) return;
  if(node.unusable && node.unusable(p, S.enemy)) return;
  p.mp -= node.cost;
  const before = p.hp;

      const inArch = xx >= gx0 && xx < gx1 && (y >= gTop + 2 || Math.hypot(xx - CX, (y - (gTop + 12))*1.2) < 24);

      } else if(xx >= gx0 - 8 && xx < gx1 + 8 && y >= gTop - 12){ const br = (xx + y) % 4 === 0; const outer = Math.hypot(xx - CX, (y - (gTop + 12))*1.2); if(outer < 36 && outer >= 24) put(xx, y, br ? [58,38,60] : [38,24,44]); }

    for(let k = 0; k < 9; k++){ const y = 118 + k*2.4, w = 40 - k*2.2; rect(CX - w/2, y, w, 1, mix([255,176,90], [90,22,20], k/9)); rect(CX - w/2, y+1, w, 1, [60,16,20]); }

/* ---------- Hall of Heroes: run records, summaries, legacy ---------- */
const HALL_KEY='emberdeep-hall-v1';
let HALL=[]; try{ const r=JSON.parse(localStorage.getItem(HALL_KEY)||'[]'); if(Array.isArray(r)) HALL=r; }catch(e){}
function saveHall(){ try{ localStorage.setItem(HALL_KEY, JSON.stringify(HALL.slice(0,40))); }catch(e){} }
function hallScore(r){ return (r.depth||1)*100 + (r.level||1)*10 + (r.bosses||0)*50 + (r.endings||0)*400 + (r.mode==='hardcore'?200:0); }
function runSnapshot(outcome, how){
  const mk = S.player && S.player.bellSlayer ? 1 : 0;
  const p=S.player, st=S.stats||{};
  return {hero:heroTitle(p), mode:p.mode||'standard', level:p.level, depth:Math.max(st.deepestFloor||1,S.depth||1), bosses:st.bossesDefeated||0, kills:st.monstersDefeated||0, treasures:st.treasures||0, gold:p.gold||0, outcome, how, ts:Date.now(), maker:mk};
}
function hallRecord(outcome, how){
  try{
    const p=S.player; if(!p) return null;
    if(!p.runId) p.runId='r'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
    let r=HALL.find(x=>x.id===p.runId), snap=runSnapshot(outcome,how);
    if(r){ const n=r.endings||0; Object.assign(r,snap); r.endings=n; } else { r=Object.assign({id:p.runId,endings:0},snap); HALL.unshift(r); }
    if(outcome==='ending') r.endings=(r.endings||0)+1;
    r.score=hallScore(r); saveHall(); return r;
  }catch(e){ return null; }
}
function legacyGold(){ const best=HALL.reduce((m,r)=>Math.max(m,r.depth||0),0); return Math.min(120, Math.floor(best/10)*12); }
function summaryHtml(r){
  if(!r) return '';
  const cell=(k,v)=>`<div class="hs-c"><b>${v}</b><span>${k}</span></div>`;
  return `<div class="hs-grid">${cell('Floor reached',r.depth)}${cell('Level',r.level)}${cell('Bosses felled',r.bosses)}${cell('Monsters slain',r.kills)}${cell('Chests opened',r.treasures)}${cell('Score',r.score)}</div>`;
}
function openHall(){ S.screen='hall'; render(); }
function closeHall(){ S.screen='title'; render(); }
function hallScreenHtml(){
  const rows=[...HALL].sort((a,b)=>(b.score||0)-(a.score||0));
  const lg=legacyGold();
  const fmt=t=>{ try{ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } };
  return `<div class="frame hall-wrap">
    <h2 style="text-align:center;color:var(--ember-bright);margin-bottom:4px;">Hall of Heroes</h2>
    <p style="text-align:center;color:var(--text-muted);font-size:.9em;margin-bottom:10px;">${rows.length?'Every Delver the Emberdeep has taken, and those who climbed back out.':'No names carved here yet.'}${lg?` The Hall's memory gives each new hero ${lg} gold.`:''}</p>
    ${rows.slice(0,15).map((r,i)=>`<div class="hall-row${i===0?' top':''}"><div class="hr-rank">${i+1}</div><div class="hr-main"><div class="hr-name">${r.hero}${r.maker?' <span class="hr-end" title="Maker-slayer">&#10022;</span>':''}${r.endings?` <span class="hr-end">&#9733;${r.endings>1?' x'+r.endings:''}</span>`:''}</div><div class="hr-sub">Level ${r.level} &middot; Floor ${r.depth} &middot; ${r.bosses} boss${r.bosses===1?'':'es'} &middot; ${r.outcome==='ending'?(r.how||'Reached an ending'):('Fell to '+(r.how||'the dark'))}</div></div><div class="hr-score">${r.score}<small>${fmt(r.ts)}</small></div></div>`).join('')}
    <div class="btn-col" style="margin-top:14px;"><button class="primary" onclick="closeHall()">Back</button></div>
  </div>`;
}

function goToTreeSelect(){ S.screen = 'modeSelect'; render(); }
function chooseMode(m){ S.pendingMode = m; drawStartTree(); }
function drawStartTree(){
  const keys = Object.keys(TREES).filter(k => !TREES[k].exclusive);
  S.startRoll = {key: keys[rnd(keys.length)], rarity: rollRarity(0)};
  S.screen = 'treeReveal';
  render();
}
function chooseTree(key, rarity){
  S.player = makePlayer(key, rarity || (S.startRoll && S.startRoll.rarity) || 'common', S.pendingMode || 'standard');
  S.player.intro = 1; S.player.unlocks = {}; S.player.trips = 0;
  try{ const lg = legacyGold(); if(lg){ S.player.gold = (S.player.gold||0) + lg; S.player.legacy = lg; } }catch(e){}
  S.treesReturn = 'town';
  S.screen = 'trees';
  render();
}
function restart(){ S = freshState(); render(); }

 opts:[L_('“I’m not here for your people. I’m here for the Ember.”','He laughs. “Aren’t we all. I was foreman of the third shift. When the fire sank, Veyra asked us to follow it so the light wouldn’t go out. We never saw the sun again. Don’t tell the crew.” <i>A lad called Nib walked out last winter. “Tell him the door isn’t shut.”</i>','listen'),L_('“Your people could go home if you stepped aside.”','“Home? Ask the city if it wants us back.”','press'),L_('“Move, or I’ll move you.”','He lifts the horn. The drums start again.','attack')],
 end:'The Warchief drops his horn. Down the tunnels, the drums stop one by one. The goblins lower their lanterns and turn toward the way up. Nobody stops them.'},
30:{name:'The Ember Warden',who:'Ember Warden',scene:'Cracked black glass over a lake of coals. A figure kneels at a hearth the size of a house and feeds it with bare hands. On his breastplate, where a name belongs, the metal is scoured smooth.',line:'“Mind your step. She’s sleeping. Can you hear it? That’s her breathing.”',
 opts:[L_('“Who is she?”','“The fire. The Ember. They took my name to feed her, and I don’t miss it, mostly.” His voice drops. “She isn’t going out on her own. Something below keeps pulling at her. Someone is drinking her dry.”','listen'),L_('“You’re burning yourself for a fire that’s failing.”','“She isn’t failing. She’s being taken.” He will not say by whom.','press'),L_('“Get up. This ends here.”','“Then I’m sorry.” The hearth roars up with him.','attack')],
 end:'“It isn’t dying,” he whispers. “Something below keeps pulling at it.” On his breastplate a single letter etches itself back, then a second, and then he is gone.'},
40:{name:'The Rime Matriarch',who:'Rime Matriarch',scene:'A cathedral of ice. Wolves ring a woman on a throne of frozen roots. An old wolf rests its head on her boot.',line:'“Come closer, pup. You’re shivering. That’s good. It means you’re still warm.”',
 opts:[L_('“What happened to your warmth?”','“I gave it to the fire, the way you hand a coat to someone drowning. Nobody tells you it doesn’t come back. The wolves stay because they are cold too.” <i>“It pulls the warm things first. Warmth, then breath, then life.”</i>','listen'),L_('“Call off your wolves.”','“Call off my children? You’re cruel, pup.”','press'),L_('“Enough. I’m going through.”','“Then the pack will see you out.”','attack')],
 end:'She exhales, and for the first time her breath does not freeze. The wolves lie down around her. Overhead, the ice begins to drip.'},
50:{name:'The Drowned King',who:'Drowned King',scene:'A flooded throne hall, the water perfectly still. A crowned man sits with his mouth slightly open, unable to draw breath. A bubble rises from his throat.',line:'“Welcome… to my… court. Forgive… the pauses. I am… saving… my breath.”',
 opts:[L_('“Take your time. I can wait.”','“Kind… few… wait.” He was the first to refuse the binding, and the Sovereign took his breath so he could not speak against it. <i>“It is not a fire. It is asleep. Do not feed it. Do not bind it.”</i>','listen'),L_('“Who took your breath?”','“He… who gave… nothing.”','press'),L_('Strike.','The water rises to your shoulders.','attack')],
 end:'He draws one long breath, and the water goes still. “Thank you. I only wanted to finish a sentence.”'},
60:{name:'The Garden Reaper',who:'Garden Reaper',scene:'A walled garden of pale flowers growing from bone mulch. A man in a straw hat trims the roses with a scythe, counting under his breath. His shadow falls the wrong way.',line:'“Seven hundred and four. Seven hundred and five. Mind the little ones, they’ve only just come up.”',
 opts:[L_('“They’re beautiful. What are they?”','“Everything the Ember took that had nowhere else to go. Somebody’s warmth, or breath, or name. The binding doesn’t destroy what it takes. It plants it.” <i>Veyra stepped into the Ember not to feed it, but to ease it.</i>','listen'),L_('“You’re the Reaper. You’ve killed people.”','“Only the ones who asked.”','press'),L_('Draw your weapon.','“Please don’t. The little ones.”','attack')],
 end:'The roses close, one by one. “All of them,” he says. “Counted.” One bone-white bloom stays open, and it is warm.'},
70:{name:'The Glass Minotaur',who:'Glass Minotaur',scene:'A ring of mirrors, a broken-horned beast pacing in each. The real one stands in the middle with his eyes sealed behind dark glass.',line:'“Which of you is the one who came in? There are three of you. Four. Say something, so I can tell.”',
 opts:[L_('“I’m the one who’s speaking.”','He turns toward your voice. “Voices don’t lie the way mirrors do.” He remembers a day he only heard. <i>“Let it go out when it is ready. Do not feed it. Do not be afraid of the dark.”</i>','listen'),L_('“Which of them is real?”','“That is what I asked.” He turns to the wrong mirror.','press'),L_('Strike.','“There! No… there!”','attack')],
 end:'He looks at you, not at the glass. The dark discs crack and fall away. “Oh,” he says. “So that is what a person looks like.”'},
80:{name:'The Storm Sovereign',who:'Storm Sovereign',scene:'A hall of iron lightning-rods under black cloud. A figure of armour and thunderhead roars without sound, yet you understand him the way you understand weather.',line:'<i>“LITTLE WALKER. I HAVE NOTHING TO SAY. I HAVE SO MUCH TO SAY.”</i>',
 opts:[L_('Stand still and listen to the storm.','<i>“TEN OF US SWORE THE OATH. I CARRIED IT IN MY VOICE. WE WILL FEED THE FIRE UNTIL IT IS SAFE.”</i> Nobody wrote down what safe meant.','listen'),L_('Shout over the storm.','<i>“LOUD. YES. THEY ALL SHOUT.”</i>','press'),L_('Strike.','Lightning answers.','attack')],
 end:'Silence. Then one ordinary word in a small human voice: “Thanks.” The rods stop singing, and you can hear your own heartbeat.'},
90:{name:'The Hollow Emperor',who:'Hollow Emperor',scene:'Black marble. An empty suit of armour on a throne. Many voices speak from beneath the visor, some young, some old, some of them yours.',line:'“Who am I? Who was I? Say a name. Any name.”',
 opts:[L_('“I don’t know who you were. Tell me what you remember.”','One thin voice remains. “A laugh. A kitchen. Someone calling me in to eat.” <i>The Sovereign promised every Keeper their gift would come back. He never meant to return it.</i>','listen'),L_('“I’ll call you Emperor.”','“That’s a title. That’s not a name.”','press'),L_('Draw your weapon.','All the voices speak at once.','attack')],
 end:'The armour folds in on itself. Nothing was ever inside. One small private voice says something that sounds like a name, and the armour is empty.'},
100:{name:'The Abyssal Sovereign',who:'Abyssal Sovereign',scene:'Nine empty chairs ring the walls; a tenth stands on a dais over a faint glow. On it sits a colossal figure in black iron, wearing the Abyssal Crown. His voice is the altar’s.',line:'“You have come far, little ember. Nine of mine have fallen to you. Tell me why you came.”',
 opts:[L_('“To find out what happened to Veyra.”','Long silence. “My name is Orren. I was her friend before I was anything else. She stepped into the fire and I was too slow. She said: let it go out when it is ready. I heard: keep it burning. Do you know how long it is to keep a promise you are no longer sure you made?”','listen'),L_('“To end the binding.”','“You will end a great deal more than that.”','press'),L_('Draw your weapon.','“So be it.” The nine chairs rattle.','attack')],

X(10,{scene:'A round hall, one stair down. Torches that have not been lit in a century leave their sconces black. An armoured figure stands in the centre with his sword planted point-down before him. Around his boots the stone is worn into a shallow bowl, scratched with tally marks, thousands of them, the marks of a man who has tried to kneel for years and has not been let.',
 line:'“Halt. This is the first ward, and I keep it. I have kept it a very long time. State your oath, or turn back.”',
 r:['“Honest.” The visor tilts, as if he were trying to remember what that felt like. “I had forgotten that was possible. Everyone who comes down here swears something. I swore to hold this stair until relieved, and I no longer remember whom I was waiting for. I counted the years. I lost count in the second century.” His grip shifts on the hilt. “Make it quick. I would like to lie down.” <i>“She told us to stand watch until it was ready. Nobody ever told us what ready meant.”</i>','“The oldest orders. The ones that were never withdrawn.” For a moment the armour seems to sag. “I would tell you more, but the more I say, the less sure I am it was ever true.” He says nothing else and raises the blade, slowly, like a man lifting a weight he has carried too long.','“So be it.” The armour straightens with a groan, and every joint rings like a bell. “Forgive me. I do not know any other way to end a conversation.”'],
 end:'The knight kneels, and does not rise. The armour stops creaking. Behind the visor there is only dust, and it looks like relief. The sword stays upright in the stone, a grave marker at last, and for the first time the hall is quiet in the way a room is quiet when somebody is asleep in it. Somewhere far above, someone you have never met sleeps through the whole night.'});
X(20,{scene:'The warren’s heart: rope bridges slung between stone galleries, lantern-lit tunnels stretching in every direction, and the smell of tallow and hot iron. The drums stop the moment you step out of the dark. Hundreds of eyes watch from the shadows. A huge scarred figure sits on a throne made from a wagon bed and a fallen bell, a ledger the size of a door open on one knee, its pages crammed with a thousand tiny tallies.',
 line:'“That’s far enough, surface-walker. Say your piece, or leave in pieces. I’ve got three hundred mouths to feed and not much patience left.”',
 r:['He laughs, a short, tired bark. “Aren’t we all. Hold on, put the blade down, I haven’t said anything yet.” He rubs the scar across his brow. “I was foreman of the third shift. When the fire sank, Veyra asked us to follow it down so the light wouldn’t go out. Said it would only be for a season. It’s been three hundred years and I haven’t seen the sun since.” He glances at the ledger. “Every name in here is someone who trusted me. Don’t tell the crew I told you.” <i>A lad called Nib walked out last winter. “Tell him the door isn’t shut. Tell him the work is done.”</i>','“Home?” His voice goes flat. “Ask the city if it wants us back. We carry a hundred names no one has said aloud since the first winter, and nobody up there remembers the wages we were never paid.” He closes the ledger carefully, as if it might wake. “Maybe that’s the question. Not whether we can go home. Whether anyone is left to open the door.”','He lifts the horn with a sigh, as if he had been hoping you would say that. “The lads have been itching.” The drums start again, slow at first, then faster, until the whole warren is shaking with it.'],
 end:'The Warchief drops his horn, and the sound rolls down every tunnel. One by one the drums stop. In the new silence you can hear boots on stone, hundreds of them, turning slowly toward the way up. The goblins lower their lanterns. Nobody stops them. A single drum beats once more, softly, and a voice somewhere in the dark says, “Third shift’s done, lads.”'});
X(30,{scene:'Cracked black glass over a lake of coals, and heat that stings the eyes. At the centre a figure kneels at a hearth the size of a house and feeds it with bare, blackened hands, one ember at a time, as gently as a man tending a sleeping child. On his breastplate, where a name belongs, the metal has been scoured smooth.',
 line:'“Mind your step. She’s sleeping. Can you hear it? That slow tick under the floor. That’s her breathing. Please. Quietly.”',
 r:['“The fire. The Ember. The heart of the Dungeon.” His hands never stop moving. “They took my name to feed her, and I don’t miss it, mostly. It was a good one, I think.” His voice drops until you have to lean closer. “She isn’t going out on her own. Something below keeps pulling at her. At first I thought she was dying. Now I think someone is drinking her dry, and all of us are just helping them do it.”','“She isn’t failing,” he says, and for the first time his voice has an edge. “She’s being taken. There is a difference, and it matters more than I can tell you.” He turns back to the hearth and will not say by whom, no matter how you press, only that the heat flows down and never back up.','“Then I am sorry.” He rises slowly, joints cracking, and the hearth rises with him in a roar of orange light. “Whatever you do, do it quietly. She sleeps so lightly.”'],
 end:'The Warden sinks onto the coals, and the fire does not burn him. “It isn’t dying,” he whispers. “Something below keeps pulling at it. Find who is pulling.” On his breastplate a single letter etches itself back into the metal, then a second, and a third, and then he is gone. The hearth glows a little steadier, as if someone had finally said a name to it.'});
X(40,{scene:'A cathedral of ice, blue light caught inside the walls like trapped water. Wolves ring a woman seated on a throne of frozen roots, dozens of them, pale-eyed and silent. An old wolf rests its head on her boot. Her breath does not fog, and the frost on her shoulders has been there so long it has grown into her coat.',
 line:'“Come closer, pup. You’re shivering. That’s good. It means you’re still warm, and that’s a thing worth keeping.”',
 r:['“I gave it to the fire, the way you hand a coat to someone drowning.” She smiles, and it takes effort. “Nobody tells you it doesn’t come back. First the warmth, then the breath, then the life. The wolves stay because they are cold too. They think if they curl close enough, the cold will remember how to be warm.” She strokes the old wolf’s head. “This one is the last of the first litter I raised. He doesn’t know his mother is gone.” <i>“It pulls the warm things first. Warmth, then breath, then life.”</i>','“Call off my children?” Her voice cracks like ice underfoot. “You’re cruel, pup. They are all I have left of anything that was warm.” The old wolf lifts its head and looks at you, and you realise it is the gentlest thing in the room.','“Then the pack will see you out.” The wolves rise as one, without a sound, and the cold in the room sharpens to a point.'],
 end:'She exhales, and for the first time her breath does not freeze. The wolves lie down around her, one by one, the old one first. Overhead the ice begins to drip, then to run, until the whole cathedral weeps quietly. She holds out her hands, palms up, and watches the colour come back into them as if she were meeting two old friends.'});
X(50,{scene:'A flooded throne hall, the water perfectly still and black as slate. A crowned man sits on a sunken throne with his mouth slightly open, unable to draw breath, bubbles rising from his throat one at a time. The surface above him is a mirror. Statues of courtiers stand along the walls, all turned toward him, all frozen mid-bow.',
 line:'“Welcome… to my… court. Forgive… the pauses. I am… saving… my breath. It is… the only thing… I have left… to save.”',
 r:['“Kind… few… wait.” His eyes close with the effort. He was the first to refuse the binding, and the Sovereign took his breath so that he could not speak against it. “They gave… the Ember… everything. I asked… why. No one… could say.” A long bubble rises. “So I stopped… and the Sovereign… stopped me.” <i>“It is not a fire. It is asleep. Do not feed it. Do not bind it.”</i> The words come out one syllable at a time, as if each costs him a year.','“He… who gave… nothing.” That is all he will say. The water around the throne ripples once, as if the whole hall were holding its breath on his behalf.','The water rises to your shoulders in a single heave, cold as a hand closing. The courtiers’ statues turn, slowly, to look at you.'],
 end:'The king draws breath. It is a long, ragged, astonished breath, the first in centuries, and it fills the whole hall. The water goes still and then clear, and you can see the courtiers’ faces at last. They are crying. He looks at his hands, then at you. “It is… very loud,” he says, and laughs, and keeps breathing.'});
